# Phase E — CI gate. Runs on every push / PR: typecheck + unit tests + build.
# The same checks we run locally, now enforced automatically so an
# AI-introduced regression can never reach main unnoticed.
#
# The Build step exists because of the 2026-06-12 stale-deploy incident: the
# Next 14->16 upgrade compiled + typechecked + tested green but FAILED every
# Railway build (no Node pin). CI never built, so the break shipped to main and
# prod sat on stale code. `next build` here is now the real build gate. It uses
# a throwaway DATABASE_URL — `next build` only needs the Prisma *client*
# (generated by postinstall), not a live DB; dynamic pages aren't rendered at
# build time. node-version stays >= Next 16's floor (20.9).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (baseline is 0 errors — warnings don't fail)
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build (catches deploy-target build breaks CI would otherwise miss)
        # --webpack to match the Cloudflare deploy builder (open-next.config.ts).
        # next.config carries a webpack() hook for the Prisma wasm; the default
        # Turbopack builder errors on a webpack config with no turbopack config.
        run: npx next build --webpack
        env:
          # Throwaway — next build needs the Prisma client (postinstall), not a
          # live DB. Dynamic (cookie-driven) pages aren't rendered at build time.
          DATABASE_URL: file:./ci.db
          NEXT_TELEMETRY_DISABLED: "1"

  # Browser-level regression gate — the class of bug unit tests can't see
  # (dead buttons, auth loops, role lockouts, crashed pages). Drives real
  # Chromium through login, logout, navigation, and permission enforcement
  # against a seeded throwaway SQLite. Runs on `next dev`: a prod-node
  # `next start` can't work here (the bundle carries the Cloudflare-runtime
  # Prisma client, whose wasm only loads on workerd) — prod-only behavior
  # like the strict CSP is verified against the live Workers deployment.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A pasted key must never land on a branch undetected (RUNBOOK §1 makes
  # rotation manual — this makes detection automatic). Full history is scanned
  # (fetch-depth: 0) so a secret buried in an earlier commit of the PR fails
  # the gate too, not just the tip.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

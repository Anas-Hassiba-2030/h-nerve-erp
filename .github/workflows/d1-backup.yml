# Daily production D1 backup — gap #4 of the 100/100 readiness list.
#
# The dump is uploaded as a workflow ARTIFACT, never committed to the repo:
# it contains real tenant data (live Hourani bookings, the finance ledger) and
# would bloat history irreversibly.
#
# Every run also DRILLS the dump — topo-sorts it and restores it into a
# throwaway SQLite database, verifying row counts match. A backup nobody has
# restored is a guess, so the schedule proves restorability daily rather than
# discovering the dump is unusable during an actual outage.
#
# ⚠️ NOT a zero-impact operation. `wrangler d1 export` mutates nothing, but
# Cloudflare warns the database "will be unavailable to serve queries" while
# the export runs. Wrangler auto-accepts that prompt in CI. The window is
# short at this data size (well under a megabyte), which is why the schedule
# sits at 02:30 UTC — 05:30 in Jordan, the quietest hour for this tenant. If
# the database grows materially, re-check that assumption before trusting a
# daily run against production.
#
# TOKEN PERMISSION: CLOUDFLARE_API_TOKEN needs **Account → D1 → Edit** on the
# account that owns this database. The token this repo currently uses deploys
# the Worker fine but has ZERO D1 access — the query endpoint returns
# `code: 7403` ("not authorized to access this service") and export returns
# `code: 10000` (runs 30125859202, 30296159132, 30296405497, across a claimed
# permission grant). That signature means the granted D1 permission landed on a
# DIFFERENT token than the one stored in the CLOUDFLARE_API_TOKEN secret — the
# fix is to put a token WITH D1 Edit into the secret, not to re-edit a token
# that isn't the one CI uses. The preflight below gates on exactly this and
# fails fast with the remediation, so a doomed export never runs against prod.

name: D1 Backup

on:
  schedule:
    # 02:30 UTC daily — outside Jordan business hours (UTC+3).
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the restore drill) needs Node 22+.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Permission gate. `d1 execute --remote` is the lightest possible D1 call:
      # if the token can't run this SELECT, it certainly can't export, so we
      # fail HERE with an actionable message rather than letting the export step
      # print a raw Cloudflare API stack trace. This never touches or mutates
      # the database — it reads one count. If it fails, the token in the
      # CLOUDFLARE_API_TOKEN secret lacks D1 access on this account (see the
      # header note and docs/OWNER-ACTIONS.md §3).
      - name: Verify token can reach D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler d1 execute h-nerve-erp-db --remote --json \
               --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table'"; then
            echo "✔ token can read D1 — proceeding to export"
          else
            echo ""
            echo "✖ CLOUDFLARE_API_TOKEN cannot access D1 on this account."
            echo "  The query endpoint returned an authorization error (code 7403/10000)."
            echo "  This token deploys the Worker but has NO D1 permission."
            echo ""
            echo "  Fix (owner): create or edit a Cloudflare API token that has"
            echo "  Account → D1 → Edit on the account owning h-nerve-erp-db, then"
            echo "  update the CLOUDFLARE_API_TOKEN GitHub Actions secret with it."
            echo "  https://dash.cloudflare.com/profile/api-tokens"
            echo "  Details: docs/OWNER-ACTIONS.md §3"
            exit 1
          fi

      - name: Export production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/d1-backup.mjs --out-dir backups

      - name: Drill the restore
        # Proves the dump is importable AND complete. Fails the run — and so
        # notifies — if the backup would not actually bring the system back.
        run: |
          for dump in backups/*.sql; do
            echo "::group::drill $dump"
            node scripts/ops/d1-restore-drill.mjs "$dump"
            echo "::endgroup::"
          done

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/
          # 30 days of daily restore points. Raise if a longer window is
          # needed; GitHub caps free-tier artifact storage.
          retention-days: 30
          if-no-files-found: error

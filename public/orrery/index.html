/* ═══════════════ HERITAGE LUXURY · tokens ═══════════════ */
:root{
  --night:#0D1F1A; --night-2:#112A23; --night-3:#0a1813;
  --ivory:#F6F1E7; --cream:#FEFCF7;
  --emerald:#1F4D3F; --emerald-soft:#2E6B57;
  --gold:#C2A35A; --gold-soft:#DCC38A;
  --ink:#2A2A26; --ink-muted:#6B6459;
  --mist:#CDE0D6; --line:#E4DCCB;
  --sage:#7E9B86; --brick:#A86A5C;
  --display:"Cormorant Garamond","Newsreader",serif;
  --ui:"Cairo",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--mist);font-family:var(--ui)}
body{position:fixed;inset:0;cursor:default;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;caret-color:transparent;-webkit-tap-highlight-color:transparent}
.body,.insight,.core,#brain,#sky,#starfield,.aurora,#floor,#mobile-orrery,#topbar{caret-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ═══════════════ THE THRESHOLD (branded loading screen) ═══════════════ */
#threshold{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:radial-gradient(ellipse 100% 100% at 50% 50%, #0c2019 0%, #07120e 70%, #050d0a 100%);cursor:pointer}
#threshold.gone{opacity:0;pointer-events:none;transition:opacity .7s ease}
#thresh-logo{width:min(40vw,220px);height:auto;filter:drop-shadow(0 0 22px rgba(194,163,90,.35))}
#thresh-word{font-family:var(--display);font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:.32em;
  color:#fff;margin-top:14px;opacity:0;text-indent:.32em}
#thresh-sub{font-family:var(--ui);font-size:13px;letter-spacing:.1em;color:var(--gold-soft);opacity:0}
/* stroke-draw */
#thresh-logo .tl-draw{stroke-dasharray:120;stroke-dashoffset:120}
#thresh-logo .tl-ring{stroke-dasharray:560;stroke-dashoffset:560}
#thresh-logo .tl-dot,#thresh-logo .tl-core{opacity:0}
#thresh-logo .tl-halo{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4)}
.th-run .tl-draw{animation:tl-draw .9s cubic-bezier(.65,0,.35,1) forwards}
.th-run .tl-draw:nth-of-type(2){animation-delay:.12s}
.th-run .tl-draw:nth-of-type(3){animation-delay:.30s}
.th-run .tl-ring{animation:tl-draw 1.2s cubic-bezier(.65,0,.35,1) .2s forwards}
.th-run .tl-dot{animation:tl-pop .4s ease .7s forwards}
.th-run .tl-halo{animation:tl-bloom 1.0s ease .65s forwards}
.th-run .tl-core{animation:tl-pop .5s ease .7s forwards}
@keyframes tl-draw{to{stroke-dashoffset:0}}
@keyframes tl-pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes tl-bloom{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:.9;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  #thresh-logo .tl-draw,#thresh-logo .tl-ring{stroke-dashoffset:0}
  #thresh-logo .tl-dot,#thresh-logo .tl-core,#thresh-logo .tl-halo{opacity:1;transform:none}
}

/* ═══════════════ COSMIC CANVAS LAYERS ═══════════════ */
#sky{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 120% 90% at 50% 18%, #143229 0%, var(--night) 55%, var(--night-3) 100%);}
#starfield{position:fixed;inset:0;z-index:1;}
.aurora{position:fixed;border-radius:50%;filter:blur(54px);z-index:2;pointer-events:none;will-change:transform;opacity:0;mix-blend-mode:screen;}
.aurora.a1{width:46vw;height:46vw;left:8%;top:6%;background:radial-gradient(circle,rgba(46,107,87,.55),transparent 70%);}
.aurora.a2{width:40vw;height:40vw;right:4%;top:40%;background:radial-gradient(circle,rgba(194,163,90,.30),transparent 70%);}
.aurora.a3{width:50vw;height:50vw;left:30%;bottom:-12%;background:radial-gradient(circle,rgba(205,224,214,.16),transparent 70%);}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vw,4vh) scale(1.08)}66%{transform:translate(-4vw,7vh) scale(.96)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vw,-5vh) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(5vw,-6vh) scale(1.06)}80%{transform:translate(-6vw,3vh) scale(.94)}}

/* perspective dot-grid floor */
#floor{position:fixed;left:50%;bottom:-4vh;width:200vw;height:46vh;z-index:2;transform:translateX(-50%) perspective(420px) rotateX(68deg);
  background-image:radial-gradient(rgba(194,163,90,.5) 1px,transparent 1.4px);
  background-size:46px 46px;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 78%);
  mask-image:linear-gradient(to top,#000 0%,transparent 78%);
  opacity:0;pointer-events:none;}

/* ═══════════════ TOP BAR ═══════════════ */
#topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:rgba(13,31,26,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(194,163,90,.16);}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-mark{width:30px;height:30px}
.tb-word{font-weight:700;font-size:16px;letter-spacing:.01em;color:#fff}
.tb-word .erp{color:var(--gold)}
.tb-livedot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.tb-livedot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sage);animation:ping 2.6s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}75%,100%{transform:scale(3);opacity:0}}
.tb-center{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.tb-clock{font-family:var(--display);font-size:21px;font-weight:600;color:var(--mist);letter-spacing:.04em}
.tb-live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sage)}
.tb-replay{display:inline-flex;align-items:center;gap:5px;margin-inline-start:8px;padding:5px 12px;border-radius:999px;
  background:rgba(194,163,90,.12);border:1px solid rgba(194,163,90,.3);color:var(--gold-soft);font-size:11.5px;font-weight:600;
  font-family:var(--ui);transition:all .3s cubic-bezier(.22,1,.36,1)}
.tb-replay:hover{background:rgba(194,163,90,.24);color:#fff;transform:translateY(-1px)}
.tb-end{display:flex;align-items:center;gap:10px}
.tb-lang{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(194,163,90,.28)}
.tb-lang .lang-opt{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--mist);font-family:var(--ui);transition:all .3s cubic-bezier(.22,1,.36,1)}
.tb-lang .lang-opt.on{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#241b06;box-shadow:0 0 14px rgba(220,195,138,.45)}
.tb-user{position:relative;display:flex;align-items:center;gap:11px;padding:5px 14px 5px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(194,163,90,.22);transition:background .3s;cursor:pointer}
.tb-user:hover{background:rgba(255,255,255,.09)}
.tb-avatar{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:600;color:var(--gold-soft);
  background:radial-gradient(circle at 38% 34%,#dff0e7,#2E6B57 70%,#0c2019);box-shadow:0 0 0 1.5px var(--gold),0 0 0 4px rgba(126,155,134,.18);flex:0 0 36px}
.tb-avatar::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(126,155,134,.5);animation:chipAura 2.8s ease-in-out infinite}
@keyframes chipAura{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:0}}
.tb-avatar::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);right:1px;bottom:6px;box-shadow:0 0 6px var(--gold)}
.tb-uinfo{display:flex;flex-direction:column;justify-content:center;line-height:1.2;text-align:start;gap:1px}
.tb-uname{font-family:var(--ui);font-size:14px;font-weight:700;color:#fff;display:block;position:relative;white-space:nowrap}
.tb-uname::after{content:"";position:absolute;inset-inline-start:0;bottom:-2px;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:inline-start;transition:transform .3s}
.tb-user:hover .tb-uname::after{transform:scaleX(1)}
.tb-urole{font-family:var(--ui);font-size:11px;color:var(--gold-soft);opacity:.85;display:block;white-space:nowrap}
.tb-caret{color:var(--gold-soft);font-size:11px;transition:transform .3s}
.tb-user.open .tb-caret{transform:rotate(180deg)}
.tb-menu{position:absolute;top:52px;inset-inline-end:0;width:230px;z-index:70;background:linear-gradient(160deg,rgba(17,42,35,.94),rgba(8,18,14,.96));backdrop-filter:blur(16px);
  border:1px solid var(--gold);border-radius:16px;box-shadow:0 24px 60px -24px rgba(0,0,0,.6);padding:8px;opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.22,1,.36,1)}
.tb-user.open .tb-menu{opacity:1;transform:none;pointer-events:auto}
.tb-menu .mi{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 14px;border-radius:11px;font-family:var(--ui);font-size:13.5px;font-weight:600;color:var(--mist);cursor:pointer}
.tb-menu .mi:hover{background:rgba(194,163,90,.14);color:#fff}
.tb-menu .mi .ic{color:var(--gold-soft);font-size:15px;width:18px;text-align:center}
.tb-menu .sep{height:1px;background:rgba(194,163,90,.18);margin:6px 10px}

/* ═══════════════ STAGE ═══════════════ */
#stage{position:fixed;inset:56px 0 0 0;z-index:10;overflow:hidden}
#trails{position:fixed;inset:56px 0 0 0;z-index:9;pointer-events:none}

/* Brain */
#brain{position:absolute;left:50%;top:50%;width:0;height:0;z-index:20}
.brain-glow{position:absolute;left:50%;top:50%;width:360px;height:360px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(194,163,90,.45),rgba(194,163,90,.10) 42%,transparent 68%);pointer-events:none;will-change:transform,opacity;}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid;transform:translate(-50%,-50%);pointer-events:none;will-change:transform;}
.ring.outer{width:360px;height:360px;border-color:rgba(194,163,90,.40);}
.ring.outer::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;border-radius:50%;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 10px var(--gold);}
.ring.middle{width:260px;height:260px;border-color:rgba(220,195,138,.55);border-width:1.5px;}
.ring.middle::before{content:"";position:absolute;bottom:-3px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--gold-soft);transform:translateX(-50%);box-shadow:0 0 8px var(--gold-soft);}
.core{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#2E6B57 0%,#1F4D3F 42%,#0c2019 100%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.5),inset 0 2px 18px rgba(220,195,138,.25),0 0 60px rgba(31,77,63,.6);
  display:grid;place-items:center;text-align:center;will-change:transform;cursor:pointer;}
.core::after{content:"";position:absolute;inset:0;border-radius:50%;background:
    radial-gradient(circle at 50% 50%,transparent 60%,rgba(194,163,90,.12) 100%),
    conic-gradient(from 0deg,transparent,rgba(220,195,138,.10),transparent 30%);}
.core-inner{position:relative;z-index:2;padding:0 14px}
.core-label{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--gold-soft);letter-spacing:.04em}
.core-iq{font-family:var(--display);font-size:76px;font-weight:600;line-height:.9;color:#fff;margin:2px 0 0;text-shadow:0 0 26px rgba(220,195,138,.55);position:relative}
.core-iq .iq-dec{font-size:19px;color:var(--gold-soft);text-shadow:none;margin-inline-start:1px}
.iq-spark{width:90px;height:18px;display:block;margin:3px auto 0}
.core-rule{height:1px;width:0;margin:5px auto 6px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:width 1s ease .8s}
.brain.lit .core-rule,.core-rule.draw{width:120px}
.core-sub{font-size:11px;color:var(--mist);opacity:.85;line-height:1.4}
.core-sub b{color:var(--gold-soft);font-weight:700}
/* instrument bezel */
.bezel{position:absolute;left:50%;top:50%;width:330px;height:330px;transform:translate(-50%,-50%);pointer-events:none;z-index:18}
/* telemetry micro-indicators */
.telem{position:absolute;left:50%;top:50%;z-index:22;display:flex;align-items:center;gap:5px;font-family:var(--ui);font-size:9.5px;font-weight:600;color:var(--mist);
  background:rgba(13,31,26,.6);border:1px solid rgba(194,163,90,.25);border-radius:999px;padding:3px 9px;white-space:nowrap;opacity:.9}
.telem b{color:var(--gold-soft);font-variant-numeric:tabular-nums}
.telem .tg{width:5px;height:5px;border-radius:50%;background:var(--sage);box-shadow:0 0 5px var(--sage)}
.telem.t-think{transform:translate(-50%,-50%) translate(0,-186px)}
.telem.t-sig{transform:translate(-50%,-50%) translate(132px,-132px)}
.telem.t-dec{transform:translate(-50%,-50%) translate(-132px,-132px)}
.telem.t-think .tg{animation:nerve 2.2s infinite}
/* focus needle sweeping the orb */
.focus-needle{position:absolute;left:50%;top:50%;width:2px;height:148px;background:linear-gradient(180deg,transparent,rgba(220,195,138,.15),var(--gold));
  transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);z-index:19;pointer-events:none}
.focus-needle .fn-chip{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:rgba(17,42,35,.92);border:1px solid var(--gold);border-radius:999px;
  padding:3px 9px;font-family:var(--ui);font-size:10px;font-weight:700;color:var(--gold-soft);white-space:nowrap}
.brain-ripple{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%) scale(1);border-radius:50%;border:1px solid var(--gold-soft);opacity:0;pointer-events:none;z-index:17;}
/* ── Emperor Moment ── */
#emp-bloom{position:fixed;left:50%;top:50%;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:70;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,247,225,.95),rgba(220,195,138,.6) 30%,rgba(194,163,90,.18) 55%,transparent 72%)}
#emp-aurora{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse 120% 90% at 50% 45%,rgba(220,195,138,.4),rgba(194,163,90,.14) 45%,transparent 75%)}
.iq-flash{animation:iqflash .8s ease}
@keyframes iqflash{0%{color:#fff}30%{color:#FBF3DC;text-shadow:0 0 40px rgba(220,195,138,1)}100%{color:#fff}}
#emp-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:95;display:flex;align-items:center;gap:13px;
  background:linear-gradient(135deg,rgba(31,77,63,.96),rgba(13,31,26,.97));border:1px solid var(--gold);border-radius:16px;padding:14px 24px;
  opacity:0;pointer-events:none;transition:all .55s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 50px rgba(220,195,138,.5);cursor:pointer}
#emp-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#emp-toast .crown{font-size:26px}
#emp-toast .et b{display:block;font-family:var(--display);font-size:18px;color:#fff}
#emp-toast .et span{font-size:12px;color:var(--gold-soft)}
/* ── QUARTER REPLAY scrubber ── */
#qr-bar{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);z-index:56;display:none;align-items:center;gap:14px;
  background:rgba(13,31,26,.82);backdrop-filter:blur(12px);border:1px solid rgba(194,163,90,.34);border-radius:999px;padding:10px 20px;
  width:min(640px,86vw);opacity:0;transition:opacity .4s,transform .4s cubic-bezier(.22,1,.36,1)}
#qr-bar.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#qr-bar .qr-label{font-family:var(--display);font-size:15px;font-weight:600;color:var(--gold-soft);min-width:108px;text-align:center;font-variant-numeric:tabular-nums}
#qrScrub{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;outline:none;
  background:linear-gradient(90deg,var(--gold) var(--qrfill,100%),rgba(205,224,214,.18) var(--qrfill,100%))}
#qrScrub::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:grab;border:0;
  background:radial-gradient(circle at 38% 35%,#FBF3DC,#DCC38A 55%,#C2A35A);box-shadow:0 0 12px rgba(220,195,138,.7)}
#qrScrub::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:0;background:radial-gradient(circle at 38% 35%,#FBF3DC,#DCC38A 55%,#C2A35A)}
#qrNow{flex:0 0 auto;font-family:var(--ui);font-size:12.5px;font-weight:700;color:var(--gold-soft);background:rgba(194,163,90,.14);
  border:1px solid rgba(194,163,90,.4);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
#qrNow:hover{background:rgba(194,163,90,.26);color:#fff}
body.qr-mode #sky{transition:filter 1s ease}
body.qr-mode.qr-past #sky{filter:sepia(.18) brightness(.92)}
.qr-banner{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:56;font-family:var(--ui);font-size:12px;font-weight:700;
  letter-spacing:.1em;color:var(--gold-soft);opacity:0;transition:opacity .4s;pointer-events:none;text-transform:uppercase}
body.qr-mode .qr-banner{opacity:.8}

/* ── THE MORNING BRIEFING ── */
#mb-overlay{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse 100% 100% at 50% 40%,rgba(10,28,22,.92),rgba(5,13,10,.96));backdrop-filter:blur(8px);
  opacity:0;transition:opacity .6s ease}
#mb-overlay.show{opacity:1}
#mb-overlay .mb-card{width:min(620px,92vw);background:linear-gradient(160deg,rgba(20,46,38,.96),rgba(8,18,14,.97));
  border:1px solid rgba(194,163,90,.4);border-radius:24px;padding:38px 40px;box-shadow:0 40px 100px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(220,195,138,.12);
  transform:translateY(18px) scale(.98);transition:transform .7s cubic-bezier(.22,1,.36,1)}
#mb-overlay.show .mb-card{transform:none}
.mb-eyebrow{font-family:var(--ui);font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--gold-soft);text-transform:uppercase}
.mb-greet{font-family:var(--display);font-size:clamp(30px,4vw,42px);font-weight:600;color:#fff;line-height:1.05;margin:12px 0 16px}
.mb-narr{font-family:var(--display);font-size:clamp(16px,1.7vw,19px);line-height:1.7;color:#e8e1d2;font-weight:500}
.mb-narr b{color:var(--gold-soft);font-weight:600}
.mb-chips{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 26px}
.mb-chip{font-family:var(--ui);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid rgba(194,163,90,.25)}
.mb-chip.up{color:#9bbf9f;background:rgba(126,155,134,.14)} .mb-chip.down{color:#cf9384;background:rgba(168,106,92,.16)}
.mb-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.mb-btn{font-family:var(--ui);font-size:14px;font-weight:700;min-height:46px;padding:0 22px;border-radius:999px;cursor:pointer;border:0;transition:transform .2s,box-shadow .2s}
.mb-btn.primary{color:#241b06;background:linear-gradient(135deg,var(--gold-soft),var(--gold));box-shadow:0 8px 24px -10px rgba(194,163,90,.7)}
.mb-btn.primary:hover{transform:translateY(-1px)}
.mb-btn.ghost{color:var(--mist);background:transparent;border:1px solid rgba(194,163,90,.4)}
.mb-btn.ghost:hover{background:rgba(194,163,90,.12);color:#fff}
@media (prefers-reduced-motion:reduce){#mb-overlay,#mb-overlay .mb-card{transition:none}}

/* ════ Center-variant host + shared 92/label ════ */
.center-host{position:absolute;left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:3}
.cv{position:absolute;inset:0;display:grid;place-items:center}
.cv-iq{font-family:var(--display);font-weight:600;color:#fff;line-height:.9;text-shadow:0 0 26px rgba(220,195,138,.55);position:relative;z-index:5}
.cv-iq .iq-dec{font-size:.32em;color:var(--gold-soft);text-shadow:none}
.cv-lbl{font-family:var(--ui);font-size:10px;font-weight:600;color:var(--gold-soft);letter-spacing:.08em;text-align:center;line-height:1.5;z-index:5}
.cv-lbl b{color:var(--mist);opacity:.7;font-weight:500;display:block;font-size:9px}
/* ── Deep Signet (merged center) ── */
.ds-wrap{position:absolute;inset:0;display:grid;place-items:center}
.ds-corona{position:absolute;width:188px;height:188px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(220,195,138,0),rgba(220,195,138,.5) 12%,rgba(220,195,138,.12) 30%,rgba(220,195,138,.4) 55%,rgba(220,195,138,0) 78%);
  filter:blur(2.5px);mix-blend-mode:screen;will-change:transform,opacity}
.ds-sphere{position:absolute;width:168px;height:168px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 42% 36%,#16352b 0%,#0c2019 38%,#060f0b 72%,#030705 100%);
  box-shadow:0 0 0 1px rgba(194,163,90,.5),inset 0 6px 26px rgba(0,0,0,.7),inset 0 -2px 18px rgba(220,195,138,.06),0 0 50px rgba(31,77,63,.4)}
.ds-sheen{position:absolute;top:8px;left:18%;width:64%;height:34%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 0%,rgba(220,235,225,.22),transparent 70%);pointer-events:none}
.ds-sigil{position:absolute;inset:0;width:100%;height:100%}
.ds-sigil .dsg{stroke:url(#dsGrad);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(220,195,138,.5))}
.ds-heart{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:4;pointer-events:none}
.ds-heart .cv-iq{text-shadow:0 0 20px rgba(220,195,138,.6),0 0 4px rgba(0,0,0,.5)}
.ds-liquid{position:absolute;inset:0;filter:blur(8px);opacity:.55}
.ds-liquid span{position:absolute;border-radius:50%;mix-blend-mode:screen}
.ds-liquid span:nth-child(1){width:80px;height:80px;left:20%;top:24%;background:radial-gradient(circle,rgba(46,107,87,.7),transparent 70%)}
.ds-liquid span:nth-child(2){width:64px;height:64px;left:48%;top:50%;background:radial-gradient(circle,rgba(194,163,90,.4),transparent 70%)}
.tb-iqstat{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-size:13px;margin:0 4px}
.tb-iqstat b{color:var(--gold-soft);font-weight:700;letter-spacing:.02em}
.tb-iqstat .dot{color:rgba(194,163,90,.5)}
.tb-iqstat #tbState{color:var(--mist);opacity:.6;transition:opacity .8s}
/* ── العقل الحيّ · The Living Mind ── */
.lm-wrap{position:absolute;inset:0;display:grid;place-items:center}
.lm-corona{position:absolute;width:200px;height:200px;will-change:transform;z-index:1}
.lm-corona .lm-arc{filter:drop-shadow(0 0 6px rgba(220,195,138,.6))}
.lm-sphere{position:absolute;width:172px;height:172px;border-radius:50%;overflow:hidden;will-change:transform;z-index:2;
  background:radial-gradient(circle at 46% 42%,#102a22 0%,#0c2019 40%,#070f0c 74%,#030705 100%);
  box-shadow:0 0 0 1px rgba(194,163,90,.34),inset 0 0 34px rgba(0,0,0,.85),inset 0 0 64px rgba(0,0,0,.5),0 0 46px rgba(20,45,38,.4)}
.lm-neural{position:absolute;inset:0;width:100%;height:100%}
.lm-sheen{position:absolute;top:7px;left:15%;width:60%;height:32%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 38% 0%,rgba(205,224,214,.18),transparent 70%)}
/* the attention aperture (iris) — closed by default */
.lm-aperture{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;
  background:radial-gradient(circle,#FBF3DC 0%,#DCC38A 30%,#2E6B57 62%,#0c2019 100%);
  box-shadow:0 0 0 0 rgba(220,195,138,.9),0 0 40px rgba(220,195,138,.0)}
.lm-below{position:absolute;top:calc(50% + 106px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:13px;color:var(--gold-soft);opacity:.4;white-space:nowrap;z-index:2}
/* synapse threads reach OUTWARD (drawn on a full-stage svg) */
#lm-threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:14;overflow:visible}
#lm-threads path{fill:none;stroke:url(#lmThreadGrad);stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(220,195,138,.5))}
#center-pick{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:11px;
  background:rgba(13,31,26,.6);backdrop-filter:blur(10px);border:1px solid rgba(194,163,90,.3);border-radius:999px;padding:9px 16px}
.cp-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(194,163,90,.5);background:transparent;cursor:pointer;padding:0;transition:all .25s}
.cp-dot:hover{border-color:var(--gold)}
.cp-dot.on{background:radial-gradient(circle,#fff,var(--gold));border-color:transparent;box-shadow:0 0 10px rgba(220,195,138,.8)}
.cp-sep{width:1px;height:16px;background:rgba(194,163,90,.3)}
.cp-mode{background:rgba(194,163,90,.14);border:1px solid rgba(194,163,90,.4);color:var(--gold-soft);font-family:var(--ui);font-size:12px;font-weight:700;border-radius:999px;padding:5px 13px;cursor:pointer}
.cp-mode:hover{background:rgba(194,163,90,.26);color:#fff}

/* V1 neural core */
.v-neural .skull{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(46,107,87,.55),rgba(31,77,63,.4) 55%,rgba(12,32,25,.6));box-shadow:inset 0 2px 22px rgba(220,195,138,.18),0 0 50px rgba(31,77,63,.5);overflow:hidden}
.v-neural .skull svg{position:absolute;inset:0;width:100%;height:100%}
.v-neural .npath{stroke:#C2A35A;stroke-width:.8;fill:none;opacity:.4}
.v-neural .nnode{fill:#DCC38A}
/* V2 eye */
.v-eye .iris{position:absolute;inset:22px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(220,195,138,.5) 0deg 1.5deg,rgba(31,77,63,.9) 1.5deg 4deg);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 40px rgba(31,77,63,.5);transition:transform 2s cubic-bezier(.4,0,.2,1)}
.v-eye .iris::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 30%,rgba(46,107,87,.5) 55%,rgba(12,32,25,.95))}
.v-eye .pupil{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 42% 40%,#0c2019,#000);box-shadow:0 0 18px rgba(220,195,138,.3) inset,0 0 0 1px rgba(220,195,138,.3);z-index:4}
.v-eye .v-below{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%)}
/* V3 sigil */
.v-sigil svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)}
.v-sigil .sg{stroke:url(#sgGrad);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* V4 constellation */
.v-const .cnode{fill:#DCC38A}
.v-const .cline{stroke:#C2A35A;stroke-width:.7;opacity:.4}
.v-const svg{position:absolute;inset:0;width:100%;height:100%}
.v-const .cn-hit{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer}
.v-const-tip{position:absolute;background:rgba(13,31,26,.92);border:1px solid var(--gold);border-radius:8px;padding:4px 9px;font-family:var(--ui);font-size:10px;color:var(--mist);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
/* V5 eclipse */
.v-eclipse .disc{position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#143229,#06100c 70%);box-shadow:0 0 0 2px rgba(194,163,90,.55),0 0 28px rgba(220,195,138,.5),0 0 70px rgba(194,163,90,.25)}
.v-eclipse .corona{position:absolute;inset:24px;border-radius:50%;background:conic-gradient(from 0deg,rgba(220,195,138,.0),rgba(220,195,138,.35),rgba(220,195,138,0) 40%);filter:blur(3px)}
.v-eclipse .v-above{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%)}
.cv-breath{animation:cvbreath 4s ease-in-out infinite}
@keyframes cvbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes cvspin{to{transform:rotate(360deg)}}

/* ════ Insight-stars (outer margin only) ════ */
.ins-star{position:fixed;z-index:24;cursor:pointer;width:18px;height:18px;margin:-9px;display:grid;place-items:center;opacity:0;transition:opacity 1.5s ease}
.ins-star.lit{opacity:1}
.ins-star .isd{width:4px;height:4px;border-radius:50%;background:radial-gradient(circle,#fff,var(--gold-soft));box-shadow:0 0 7px 1px rgba(220,195,138,.7);transition:transform .4s ease,box-shadow .4s ease}
.ins-star:hover .isd{transform:scale(2.1);box-shadow:0 0 14px 3px rgba(220,195,138,.95)}
.ins-card{position:fixed;z-index:26;width:248px;max-width:74vw;padding:14px 16px;border-radius:14px;
  background:linear-gradient(160deg,rgba(20,46,38,.82),rgba(13,31,26,.82));backdrop-filter:blur(16px);
  border:1px solid rgba(194,163,90,.4);box-shadow:0 18px 50px -18px rgba(0,0,0,.7);
  opacity:0;transform:scale(.95);transform-origin:var(--ic-ox,0) var(--ic-oy,50%);pointer-events:none;
  transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.ins-card.show{opacity:1;transform:scale(1);pointer-events:auto}
.ins-card .ictext{font-family:var(--display);font-style:italic;font-size:15px;line-height:1.5;color:var(--mist)}
.ins-card .ictop{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px}
.ins-card .icmore{display:inline-block;margin-top:10px;font-family:var(--ui);font-size:12px;font-weight:700;color:var(--gold)}dex:17}
.core-hint{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(12,32,25,.92),rgba(12,32,25,.6));
  font-family:var(--display);font-size:30px;font-weight:600;color:var(--gold-soft);opacity:0;transition:opacity .35s;z-index:3;pointer-events:none;}
.core.hinting .core-hint{opacity:1}

/* connector line layer */
#wires{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:visible}
#wire{stroke:url(#wireGrad);stroke-width:1.4;opacity:0;transition:opacity .3s;stroke-dasharray:3 5}

/* orbiting bodies */
.body{position:absolute;left:50%;top:50%;z-index:25;display:flex;align-items:center;gap:10px;will-change:transform,opacity;}
.body[data-side="left"]{flex-direction:row-reverse}
.star{position:relative;width:15px;height:15px;flex:0 0 15px;border-radius:50%;
  background:radial-gradient(circle,#fff,var(--gold) 55%,var(--emerald-soft));box-shadow:0 0 12px rgba(220,195,138,.7);}
.body.anchor .star{width:19px;height:19px;flex-basis:19px}
.pill{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;white-space:nowrap;
  background:rgba(17,42,35,.6);backdrop-filter:blur(8px);border:1px solid rgba(194,163,90,.35);
  font-weight:600;font-size:15px;color:var(--mist);transition:color .3s,border-color .3s,background .3s;}
.body.anchor .pill{font-size:16.5px;font-weight:700;color:#fff}
.body.child .pill{font-size:14px;background:rgba(17,42,35,.5)}
.body:hover .pill,.body.hovered .pill{color:#fff;border-color:var(--gold);background:rgba(31,77,63,.7)}
.body{cursor:pointer}

/* SELECTED / ACTIVE — filled gold pill, dark text, strong glow (anchor) */
.body.anchor.selected .pill{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#241b06;
  border-color:var(--gold-soft);font-weight:800;box-shadow:0 0 26px rgba(220,195,138,.75),0 0 0 1px rgba(220,195,138,.5)}
.body.anchor.selected .star{width:22px;height:22px;flex-basis:22px;
  box-shadow:0 0 20px rgba(220,195,138,1),0 0 36px rgba(194,163,90,.7)}
/* child hover / selected — gold-filled too */
.body.child:hover .pill,.body.child.hovered .pill,.body.child.selected .pill{
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#241b06;border-color:var(--gold-soft);font-weight:700;
  box-shadow:0 0 20px rgba(220,195,138,.7)}
.body.child:hover .star,.body.child.selected .star{box-shadow:0 0 16px rgba(220,195,138,1)}
/* bloomed children — whole open group reads as "you are here": lit pill + ringed star */
.body.child.bloomed .pill{border-color:rgba(220,195,138,.65);color:#fff;background:rgba(46,107,87,.5);box-shadow:0 0 16px rgba(220,195,138,.3)}
.body.child.bloomed .star{box-shadow:0 0 14px rgba(220,195,138,.9),0 0 0 4px rgba(220,195,138,.18)}

/* insight stars */
.insight{position:absolute;z-index:22;cursor:pointer}
.insight .ipt{position:relative;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,var(--gold-soft) 60%,transparent);
  box-shadow:0 0 14px rgba(220,195,138,.85);will-change:transform,opacity;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s}
.insight .ipt::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(220,195,138,.4);animation:ipulse 2.6s ease-in-out infinite;}
@keyframes ipulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.8);opacity:0}}
.insight{display:none!important}
.icard{display:none!important}
.icard-orig{position:fixed;left:0;top:0;width:268px;max-width:78vw;padding:0;border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,rgba(20,46,38,.9),rgba(13,31,26,.86));backdrop-filter:blur(18px);
  border:1px solid rgba(194,163,90,.34);box-shadow:0 22px 60px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(220,195,138,.12);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s cubic-bezier(.22,1,.36,1);z-index:70;transform:scale(.94);transform-origin:var(--ic-ox,0) var(--ic-oy,50%)}
.icard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-soft),transparent);transform:scaleX(0);transform-origin:center;transition:transform .5s cubic-bezier(.22,1,.36,1) .15s}
.icard-body{padding:14px 16px}
.insight:hover .icard,.insight.active .icard{opacity:1;transform:scale(1);pointer-events:auto}
.insight:hover .icard::before,.insight.active .icard::before{transform:scaleX(1)}
.insight.active .ipt{box-shadow:0 0 22px rgba(220,195,138,1);transform:scale(1.5)}
.insight.active .ipt::after{animation:ipulse 2.2s ease-in-out infinite}
.icard .ieyebrow{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--gold-soft);margin-bottom:7px;text-transform:uppercase}
.icard .ieyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(220,195,138,.6);animation:idot 2.4s ease-in-out infinite}
@keyframes idot{0%,100%{box-shadow:0 0 0 0 rgba(220,195,138,.5);opacity:1}50%{box-shadow:0 0 0 5px rgba(220,195,138,0);opacity:.6}}
.icard .itext{font-size:14px;line-height:1.55;color:#eef4ef}
.icard .ilink{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:#241b06;background:linear-gradient(135deg,var(--gold-soft),var(--gold));box-shadow:0 0 14px rgba(220,195,138,.4);transition:transform .25s}
.icard .ilink:hover{transform:translateX(-3px)}

/* return-to-orbit hint (appears when bloomed) */
#collapse-hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:8px;
  padding:9px 18px;border-radius:999px;background:rgba(17,42,35,.7);backdrop-filter:blur(10px);border:1px solid rgba(194,163,90,.3);
  font-size:13px;font-weight:600;color:var(--mist);opacity:0;pointer-events:none;transition:opacity .4s;}
#collapse-hint.show{opacity:1;pointer-events:auto;cursor:pointer}

/* THE PLANET DIVE — clicked orb scales up to fill the viewport */
#dive-orb{position:fixed;left:50%;top:50%;width:140px;height:140px;border-radius:50%;z-index:90;pointer-events:none;
  transform:translate(-50%,-50%) scale(0);opacity:0;
  background:radial-gradient(circle at 40% 35%,#2E6B57,#1F4D3F 52%,#0c2019);
  box-shadow:0 0 90px rgba(31,77,63,.7),inset 0 2px 22px rgba(220,195,138,.32);}

/* filings — gold comets that streak inward during "The Gathering" */
#filings{position:absolute;inset:0;z-index:23;pointer-events:none}
.filing{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,#fff,var(--gold) 55%,transparent);
  box-shadow:0 0 9px rgba(220,195,138,.9);opacity:0;pointer-events:none;will-change:transform,opacity}
.filing.behind{filter:blur(2px);width:7px;height:7px}
.filing .tail{position:absolute;right:50%;top:50%;height:2px;width:var(--tail,40px);transform:translateY(-50%);
  background:linear-gradient(270deg,rgba(220,195,138,.85),transparent);border-radius:2px;transform-origin:right center}
/* snap flash when a comet locks into orbit */
.snap{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,#fff,rgba(220,195,138,.6) 40%,transparent 70%)}
/* core ignition ripple */
.core-ripple{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;
  border:2px solid rgba(220,195,138,.6);transform:scale(.5);opacity:0;pointer-events:none;z-index:19}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  .aurora,#floor{animation:none!important}
  .tb-livedot::after,.insight .ipt::after{animation:none!important}
}
.rm-static .aurora{opacity:.5!important;animation:none!important}

/* ── mobile: calm vertical list (no orbit) ── */
#mobile-orrery{display:none}
@media (max-width:720px){
  #stage > #brain, #stage > .body, #wires{display:none!important}
  #stage > .insight{display:none!important}
  #mobile-orrery{display:block;position:relative;z-index:10;padding:74px 16px 60px;max-width:560px;margin:0 auto}
  .mo-brain{display:flex;align-items:center;gap:16px;background:rgba(17,42,35,.55);backdrop-filter:blur(12px);
    border:1px solid rgba(194,163,90,.22);border-radius:20px;padding:18px 20px;margin-bottom:18px}
  .mo-orb{width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 40% 35%,#2E6B57,#1F4D3F 52%,#0c2019);box-shadow:inset 0 2px 14px rgba(220,195,138,.3),0 0 30px rgba(31,77,63,.6)}
  .mo-orb b{font-family:var(--display);font-size:26px;color:#fff;line-height:1}
  .mo-btxt .l{font-size:12px;color:var(--gold-soft)}
  .mo-btxt .t{font-family:var(--display);font-size:22px;font-weight:600;color:#fff;line-height:1.1}
  .mo-anchor{margin-bottom:12px;border:1px solid rgba(194,163,90,.22);border-radius:16px;overflow:hidden;background:rgba(17,42,35,.42)}
  .mo-head{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:14px 18px;color:var(--mist);font-family:var(--ui);font-size:17px;font-weight:700;background:none;border:0;text-align:start;cursor:pointer}
  .mo-head .star{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff,var(--gold) 55%,var(--emerald-soft));box-shadow:0 0 10px rgba(220,195,138,.7);flex:0 0 14px}
  .mo-head .chev{margin-inline-start:auto;color:var(--gold-soft);transition:transform .3s}
  .mo-anchor.open .mo-head .chev{transform:rotate(180deg)}
  .mo-kids{display:none;padding:0 14px 10px}
  .mo-anchor.open .mo-kids{display:block}
  .mo-kid{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;color:var(--mist);font-size:15px;border-top:1px solid rgba(194,163,90,.12);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start;cursor:pointer}
  .mo-kid .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);flex:0 0 6px}
  #replay{display:none}
}


/* ── next block ── */

/* ════════════════════════════════════════════════════════════════
   H-NERVE · APP-LAYER (global behaviors, self-mounting on every page)
   Command palette · Ask-the-Brain · Quick-add FAB · drag-drop ·
   toasts+undo · Time Machine · notifications · onboarding · drill-down.
   Heritage Luxury. RTL. Reduced-motion safe.
   ════════════════════════════════════════════════════════════════ */
:root{ --al-gold:#C2A35A; --al-gold-s:#DCC38A; --al-em:#1F4D3F; --al-ems:#2E6B57; --al-night:#0D1F1A; --al-mist:#CDE0D6; --al-ink:#2A2A26; }
#al-fabs{position:fixed;bottom:22px;inset-inline-start:22px;z-index:120;display:flex;flex-direction:column;gap:12px}
.al-fab{width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:22px;color:#241b06;
  background:linear-gradient(135deg,var(--al-gold-s),var(--al-gold));box-shadow:0 10px 30px -10px rgba(194,163,90,.7);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.al-fab:hover{transform:scale(1.08) translateY(-2px)}
.al-fab.brain{background:radial-gradient(circle at 38% 35%,var(--al-ems),var(--al-em) 60%,var(--al-night));color:var(--al-gold-s);font-size:24px}
.al-fab .al-fab-lbl{position:absolute;inset-inline-start:64px;white-space:nowrap;background:rgba(13,31,26,.92);color:#fff;font-family:var(--ui,"Cairo",sans-serif);font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.al-fab:hover .al-fab-lbl{opacity:1}

/* overlays (palette, ask-brain, notifications, dialogs) */
.al-scrim{position:fixed;inset:0;z-index:200;background:rgba(8,16,12,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-start;justify-content:center}
.al-scrim.open{opacity:1;pointer-events:auto}
.al-scrim.center{align-items:center}

/* command palette */
.al-pal{width:min(620px,92vw);margin-top:12vh;background:linear-gradient(160deg,#fffdf8,#f3eee3);border:1px solid var(--al-gold);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;transform:translateY(-16px);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.al-scrim.open .al-pal{transform:none}
.al-pal-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #e4dccb}
.al-pal-in input{flex:1;border:0;background:none;outline:none;font-family:var(--ui,"Cairo",sans-serif);font-size:18px;color:var(--al-ink)}
.al-pal-in .k{font-size:20px;color:var(--al-gold)}
.al-pal-list{max-height:48vh;overflow-y:auto;padding:8px}
.al-pal-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;cursor:pointer;font-family:var(--ui,"Cairo",sans-serif)}
.al-pal-row.sel,.al-pal-row:hover{background:rgba(194,163,90,.14)}
.al-pal-row .ri{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:rgba(46,107,87,.14);color:var(--al-em);flex:0 0 30px}
.al-pal-row .rt{font-size:14px;font-weight:700;color:var(--al-ink)}
.al-pal-row .rg{font-size:11px;color:#6B6459}

/* ask-brain panel */
.al-brain-panel{position:fixed;inset-inline-end:0;top:0;bottom:0;width:400px;max-width:92vw;z-index:210;background:linear-gradient(160deg,#0e2620,#081410);border-inline-start:1px solid rgba(194,163,90,.3);
  box-shadow:-20px 0 60px -30px rgba(0,0,0,.6);transform:translateX(105%);transition:transform .4s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
[dir="ltr"] .al-brain-panel{inset-inline-end:auto;inset-inline-start:0;transform:translateX(-105%)}
.al-brain-panel.open{transform:none}
.al-bp-head{display:flex;align-items:center;gap:11px;padding:18px 20px;border-bottom:1px solid rgba(194,163,90,.2)}
.al-bp-head .orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 35%,var(--al-ems),var(--al-em) 60%,var(--al-night));border:1px solid rgba(194,163,90,.4)}
.al-bp-head .t{font-family:var(--display,"Cormorant Garamond",serif);font-size:19px;font-weight:600;color:#fff}
.al-bp-head .x{margin-inline-start:auto;background:none;border:0;color:var(--al-mist);font-size:22px;cursor:pointer}
.al-bp-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.al-bp-msg{max-width:85%;padding:11px 15px;border-radius:15px;font-size:14px;line-height:1.55;font-family:var(--ui,"Cairo",sans-serif)}
.al-bp-msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--al-ems),var(--al-em));color:#fff}
.al-bp-msg.brain{align-self:flex-end;background:rgba(194,163,90,.14);color:var(--al-mist);border:1px solid rgba(194,163,90,.25)}
.al-bp-in{display:flex;gap:9px;padding:14px;border-top:1px solid rgba(194,163,90,.2)}
.al-bp-in input{flex:1;background:rgba(13,31,26,.6);border:1px solid rgba(194,163,90,.25);border-radius:14px;color:#fff;font-family:var(--ui,"Cairo",sans-serif);font-size:14px;padding:11px 15px;outline:none}
.al-bp-in button{width:44px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--al-gold-s),var(--al-gold));color:#241b06;font-size:17px;cursor:pointer}
.al-bp-mic{width:44px;border-radius:12px;border:1px solid rgba(194,163,90,.3);background:rgba(194,163,90,.1);color:var(--al-gold-s);font-size:16px;cursor:pointer}
.al-bp-mic.rec{background:rgba(168,106,92,.3);color:#cf9384;animation:al-pulse 1.2s infinite}
@keyframes al-pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* notifications */
.al-notif{width:min(380px,92vw);margin-top:62px;margin-inline-end:16px;align-self:flex-start;margin-inline-start:auto;background:linear-gradient(160deg,#fffdf8,#f3eee3);border:1px solid var(--al-gold);border-radius:16px;overflow:hidden;transform:translateY(-12px);transition:transform .3s}
.al-scrim.open .al-notif{transform:none}
.al-notif h4{font-family:var(--display,"Cormorant Garamond",serif);font-size:18px;color:var(--al-em);padding:15px 18px;border-bottom:1px solid #e4dccb;margin:0}
.al-notif-row{display:flex;gap:11px;padding:13px 18px;border-bottom:1px solid #f0e9da;font-family:var(--ui,"Cairo",sans-serif)}
.al-notif-row .ni{font-size:17px}.al-notif-row .nt{font-size:13px;color:var(--al-ink);font-weight:700}.al-notif-row .ns{font-size:11px;color:#6B6459}

/* toast w/ undo */
#al-toasts{position:fixed;bottom:22px;inset-inline-end:22px;z-index:230;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.al-toast{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(31,77,63,.97),rgba(13,31,26,.97));border:1px solid var(--al-gold);border-radius:13px;padding:12px 18px;color:#fff;font-family:var(--ui,"Cairo",sans-serif);font-size:13px;font-weight:600;box-shadow:0 14px 36px -16px rgba(0,0,0,.6);transform:translateY(16px);opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1)}
.al-toast.show{transform:none;opacity:1}
.al-toast .undo{background:rgba(194,163,90,.2);border:1px solid var(--al-gold);color:var(--al-gold-s);border-radius:999px;padding:5px 13px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px}

/* time machine */
#al-time{position:fixed;top:56px;left:0;right:0;z-index:115;background:linear-gradient(90deg,rgba(168,106,92,.95),rgba(125,90,58,.95));color:#fff;display:none;align-items:center;justify-content:center;gap:14px;padding:8px;font-family:var(--ui,"Cairo",sans-serif);font-size:13px;font-weight:700}
#al-time.show{display:flex}
#al-time button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font-family:inherit;font-weight:700}
.al-tm-pop{width:min(420px,92vw);margin-top:16vh;background:linear-gradient(160deg,#fffdf8,#f3eee3);border:1px solid var(--al-gold);border-radius:18px;padding:24px;transform:translateY(-12px);transition:transform .3s}
.al-scrim.open .al-tm-pop{transform:none}
.al-tm-pop h3{font-family:var(--display,"Cormorant Garamond",serif);font-size:24px;color:var(--al-em);margin:0 0 6px}
.al-tm-pop input[type=range]{width:100%;margin:18px 0}
.al-tm-dates{display:flex;justify-content:space-between;font-size:11px;color:#6B6459}
.al-tm-cur{font-family:var(--display,serif);font-size:30px;font-weight:600;color:var(--al-em);text-align:center;margin:10px 0}

/* drill-down dialog */
.al-dialog{width:min(440px,92vw);margin-top:14vh;background:linear-gradient(160deg,#fffdf8,#f3eee3);border:1px solid var(--al-gold);border-radius:18px;padding:26px;transform:scale(.94);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.al-scrim.open .al-dialog{transform:none}
.al-dialog h3{font-family:var(--display,serif);font-size:24px;color:var(--al-em);margin:0 0 4px}
.al-dialog .ds{font-size:12px;color:#6B6459;margin-bottom:16px;font-family:var(--ui,sans-serif)}

/* drag-drop global */
#al-drop{position:fixed;inset:0;z-index:240;background:rgba(13,31,26,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;pointer-events:none}
#al-drop.show{display:flex}
#al-drop .box{border:3px dashed var(--al-gold);border-radius:24px;padding:60px 80px;text-align:center;color:#fff;font-family:var(--ui,sans-serif)}
#al-drop .box .i{font-size:54px}#al-drop .box .t{font-size:20px;font-weight:700;margin-top:12px}

/* onboarding */
.al-onb{width:min(480px,92vw);margin-top:16vh;background:linear-gradient(160deg,#0e2620,#081410);border:1px solid var(--al-gold);border-radius:22px;padding:34px;text-align:center;transform:scale(.92);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.al-scrim.open .al-onb{transform:none}
.al-onb .logo{width:74px;height:74px;margin:0 auto 16px}
.al-onb h2{font-family:var(--display,serif);font-size:30px;color:#fff;margin:0 0 8px}
.al-onb p{font-family:var(--ui,sans-serif);font-size:14px;line-height:1.6;color:var(--al-mist);opacity:.85;margin:0 0 12px}
.al-onb .dots{display:flex;gap:7px;justify-content:center;margin:18px 0}
.al-onb .dots span{width:8px;height:8px;border-radius:50%;background:rgba(194,163,90,.3)}
.al-onb .dots span.on{background:var(--al-gold)}
.al-onb button{background:linear-gradient(135deg,var(--al-gold-s),var(--al-gold));color:#241b06;border:0;border-radius:999px;padding:12px 28px;font-family:var(--ui,sans-serif);font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  .al-fab,.al-pal,.al-brain-panel,.al-toast,.al-dialog,.al-onb,.al-notif,.al-tm-pop{transition:none!important;animation:none!important}
}
/* ── Mini-Orrery (top-bar radial nav) ── */
#al-mini-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(194,163,90,.4);cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 35%,var(--al-ems),var(--al-em) 60%,var(--al-night));flex:0 0 38px}
#al-mini-btn .mb-core{width:9px;height:9px;border-radius:50%;background:var(--al-gold-s);box-shadow:0 0 8px var(--al-gold)}
#al-mini-btn .mb-ring{position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(220,195,138,.5);animation:al-spin 8s linear infinite}
#al-mini-btn .mb-ring::after{content:"";position:absolute;top:-2px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--al-gold-s);transform:translateX(-50%)}
@keyframes al-spin{to{transform:rotate(360deg)}}

/* ════════════════════════════════════════════════════════════════
   H-NERVE · STATES & CONSISTENCY (shared, global include)
   Empty / loading-skeleton / error states + a normalization layer
   that unifies ribbon height, KPI cards, spacing, buttons, pills,
   tables, and ambient intensity across every section. One cloth.
   Works on both the ivory "work" register and the night register.
   ════════════════════════════════════════════════════════════════ */

/* ── tokens (shared scale) ── */
:root{
  --hn-ribbon-h:120px;        /* unified hero/ribbon height target */
  --hn-gap:16px;              /* unified panel gap */
  --hn-radius:18px;           /* unified card radius */
  --hn-radius-sm:13px;
  --hn-kpi-val:25px;          /* unified KPI numeral size */
  --hn-tap:44px;              /* min tap target */
}

/* ── LOADING SKELETON (shown briefly on entry) ── */
#hn-skeleton{position:fixed;inset:56px 0 0 0;z-index:140;pointer-events:none;
  display:flex;flex-direction:column;gap:16px;padding:28px 24px;max-width:1200px;margin:0 auto;
  opacity:1;transition:opacity .45s ease}
#hn-skeleton.gone{opacity:0}
.hn-sk{border-radius:var(--hn-radius);background:
  linear-gradient(100deg,rgba(180,170,140,.09) 30%,rgba(220,195,138,.22) 50%,rgba(180,170,140,.09) 70%);
  background-size:200% 100%;animation:hn-shimmer 1.3s linear infinite}
[data-living="night"] .hn-sk{background:linear-gradient(100deg,rgba(46,107,87,.14) 30%,rgba(194,163,90,.18) 50%,rgba(46,107,87,.14) 70%);background-size:200% 100%}
.hn-sk-ribbon{height:78px}
.hn-sk-row{display:flex;gap:16px}
.hn-sk-kpi{flex:1;height:86px}
.hn-sk-wide{height:230px}
@keyframes hn-shimmer{to{background-position:-200% 0}}

/* ── EMPTY STATE ── */
.hn-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:46px 24px;gap:6px;animation:hn-fade .5s ease}
.hn-empty .hn-emp-art{width:64px;height:64px;margin-bottom:8px;opacity:.85}
.hn-empty .hn-emp-t{font-family:var(--display,"Cormorant Garamond",serif);font-size:23px;font-weight:600}
.hn-empty .hn-emp-s{font-size:13px;opacity:.65;max-width:42ch;line-height:1.5}
.hn-empty .hn-emp-cta{margin-top:14px;display:inline-flex;align-items:center;gap:7px;min-height:var(--hn-tap);
  padding:0 20px;border-radius:999px;font-family:var(--ui,"Cairo",sans-serif);font-weight:700;font-size:13.5px;cursor:pointer;border:0}
/* work vs night coloring */
.hn-empty{color:var(--ink,#2A2A26)}
[data-living="night"] .hn-empty,[data-ambient="cosmic"] .hn-empty,[data-ambient="holding"] .hn-empty{color:#fff}
.hn-empty .hn-emp-t{color:var(--emerald,#1F4D3F)}
[data-living="night"] .hn-empty .hn-emp-t{color:#fff}
.hn-empty .hn-emp-cta{color:#fff;background:linear-gradient(135deg,var(--emerald-soft,#2E6B57),var(--emerald,#1F4D3F))}
[data-living="night"] .hn-empty .hn-emp-cta{color:#241b06;background:linear-gradient(135deg,#DCC38A,#C2A35A)}
@keyframes hn-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── ERROR STATE ── */
.hn-error{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 24px;gap:8px}
.hn-error .hn-err-ic{font-size:34px;color:#b06a5a}
.hn-error .hn-err-t{font-family:var(--display,serif);font-size:21px;font-weight:600;color:var(--ink,#2A2A26)}
[data-living="night"] .hn-error .hn-err-t{color:#fff}
.hn-error .hn-err-s{font-size:13px;opacity:.65;max-width:40ch;line-height:1.5}
.hn-error .hn-err-retry{margin-top:12px;min-height:var(--hn-tap);padding:0 20px;border-radius:999px;cursor:pointer;
  font-family:var(--ui,sans-serif);font-weight:700;font-size:13px;border:1px solid var(--gold,#C2A35A);background:transparent;color:var(--gold,#C2A35A)}

/* ── CONSISTENCY NORMALIZATION (one cloth) ── */
/* tap targets on every interactive control */
.ops-add,.ops-export,.ops-tab,.br-btn,.pill,.em-tab,.co-tab,.fc-btn,.seg button{min-height:var(--hn-tap)}
/* unify KPI numerals across the registers */
.kpi-val,.br-kpi .v,.ms-kpi .v,.tk-kpi .v,.ib-kpi .v,.em-kpi .v,.co-kpi .v,.wi-kpi .v{font-variant-numeric:tabular-nums}
/* unify table row min height + remove zebra */
.ops-tr.row,.br-row{min-height:var(--hn-tap)}
/* unify pill radii */
.ops-tag,.br-chip,.co-tag,.tag{border-radius:999px}

/* ── MOBILE RESPONSIVE backstop (narrow ≤640px) ── */
@media(max-width:640px){
  .wrap,.br-wrap,.ms-wrap,.tk-wrap,.ib-wrap,.em-wrap,.ml-wrap,.co-wrap,.wi-wrap{padding-left:14px;padding-right:14px}
  .br-ribbon,.ms-ribbon,.tk-top,.ib-top,.em-top,.co-ribbon,.wi-ribbon,.ml-ribbon{flex-direction:column;gap:10px}
  .br-title-box,.ms-title-box,.tk-title-box,.ib-title-box,.em-title-box{border-inline-end:0;padding-inline-end:0;min-width:0}
  .kpi-grid,.br-kpis,.ms-kpis,.tk-kpis,.ib-kpis,.em-kpis{grid-template-columns:1fr 1fr!important;display:grid!important}
  .ops-tabs,.em-tabs,#co-nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .ops-tab,.em-tab,.co-tab{white-space:nowrap;flex:0 0 auto}
  /* dense tables: let them scroll horizontally instead of crushing */
  .ops-table{overflow-x:auto}
  .ops-tr{min-width:520px}
  #al-fabs{bottom:14px;inset-inline-start:14px}
  #center-pick{bottom:14px}
}
@media(max-width:420px){
  .kpi-grid,.br-kpis,.ms-kpis,.tk-kpis,.ib-kpis,.em-kpis{grid-template-columns:1fr!important}
}

/* ── reduced motion ── */
@media (prefers-reduced-motion:reduce){
  .hn-sk{animation:none;background:rgba(180,170,140,.12)}
  #hn-skeleton{transition:none}
  .hn-empty,.hn-error{animation:none}
}
@media print{ #hn-skeleton{display:none!important} }

/* Position an insight card in the OUTER MARGIN only — never over the central
   safe zone (Brain + both orbit rings + margin). Confined to viewport with a
   16px inset. */
function placeCard(starEl, card){
  const M = 16, gap = 18;
  const s = starEl.querySelector(".ipt").getBoundingClientRect();
  const sx = s.left + s.width/2, sy = s.top + s.height/2;
  const prevOpacity = card.style.opacity; card.style.opacity = "0";
  const cw = card.offsetWidth, ch = card.offsetHeight;
  card.style.opacity = prevOpacity;
  const vw = innerWidth, vh = innerHeight;
  // central safe zone: stage centre (stage is inset 56px from top) + ring radius + pad
  const centerX = cx, centerY = 56 + cy, safeR = outerR + 70;
  const leftBound = centerX - safeR, rightBound = centerX + safeR;
  let left, ox, top;
  if (sx <= centerX){           // open into the LEFT margin
    left = Math.min(sx + gap, leftBound - gap - cw);
    left = Math.max(M, left); ox = "100%";
  } else {                       // open into the RIGHT margin
    left = Math.max(sx + gap, rightBound + gap);
    left = Math.min(left, vw - cw - M); ox = "0%";
  }
  top = Math.max(M, Math.min(sy - ch/2, vh - ch - M));
  // Fallback for narrow viewports: if the horizontal margin can't hold the
  // card clear of the safe zone, drop it into the top/bottom margin instead.
  const overlapsX = (left + cw > leftBound && left < rightBound);
  if (overlapsX){
    const topRoom = (centerY - safeR) - M, botRoom = (vh - M) - (centerY + safeR);
    if (sy <= centerY && topRoom >= ch + gap) top = M;
    else if (botRoom >= ch + gap) top = vh - ch - M;
    left = Math.max(M, Math.min(sx - cw/2, vw - cw - M));
    ox = "50%";
  }
  const oy = Math.max(0, Math.min(100, ((sy - top)/ch)*100)) + "%";
  card.style.left = left + "px";
  card.style.top = top + "px";
  card.style.setProperty("--ic-ox", ox);
  card.style.setProperty("--ic-oy", oy);
}

/* ── 3D orbital scene params ── */
const TILT = 58*Math.PI/180;            // orbital plane tilt
const PERSP = 1400;
let sceneT = 0;                          // floating-scene clock
let parScene = {x:0,y:0,tx:0,ty:0};      // mouse parallax
/* ── position helper — FLAT orbital plane, all bodies always visible/clickable ── */
function place(b, now){
  const elapsed = (now - t0)/1000;
  const theta = b.angle0 + b.dir * b.omega * elapsed;
  b.curR += (b.rTarget !== undefined ? b.rTarget - b.curR : 0) * 0.08;
  const r = b.rTarget !== undefined ? b.curR : b.r;
  // flat circle position + gentle floating breath + mouse parallax
  const breath = 1 + Math.sin(sceneT*0.5)*0.012;
  const bob = Math.sin(sceneT*0.8)*5;
  const x = Math.cos(theta) * r * breath + parScene.x*(b.type==="child"?1.5:1);
  const y = Math.sin(theta) * r * breath + bob + parScene.y*(b.type==="child"?1.5:1);
  b._x = cx + x; b._y = cy + y;
  const sc = b.s * (b.hovered ? 1.15 : 1);
  b.el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) scale(${sc})`;
  b.el.style.filter = "";
  b.el.style.zIndex = 30;                  // ALWAYS above the sphere
  let op = b.op * (b.roleMul===undefined?1:b.roleMul) * (b.qrMul===undefined?1:b.qrMul);
  if (stage.classList.contains("has-hover") && !b.hovered) op *= 0.45;
  if(b.qrScale!==undefined){ /* qr scale handled in transform below via b.qrScale */ }
  b.el.style.opacity = op;
  b.el.style.pointerEvents = (b.roleMul!==undefined && b.roleMul < 0.15) ? "none" : "auto";
  // crisp upright label, kept toward the outside
  b.el.dataset.side = (Math.cos(theta) < 0) ? "left" : "right";
  // record trail point
  if(b.s>0.5 && op>0.2){ pushTrail(b); }
}

/* ── orbit trails (faint gold comet-streaks behind each body) ── */
const tcv = document.getElementById("trails"); const tctx = tcv.getContext("2d");
function sizeTrails(){ tcv.width=innerWidth*DPR; tcv.height=innerHeight*DPR; tcv.style.width=innerWidth+"px"; tcv.style.height=(innerHeight-56)+"px"; }
function pushTrail(b){ if(reduce) return; (b._trail || (b._trail=[])).push({x:b._x,y:b._y,d:1}); if(b._trail.length>14) b._trail.shift(); }
function drawTrails(){
  if(reduce){ return; }
  tctx.setTransform(DPR,0,0,DPR,0,0); tctx.clearRect(0,0,innerWidth,innerHeight);
  for(const b of bodies){ const tr=b._trail; if(!tr||tr.length<2||b.op<0.2) continue;
    for(let i=1;i<tr.length;i++){ const a=tr[i-1],p=tr[i]; const al=(i/tr.length)*0.22*(0.5+p.d*0.5)*b.op;
      tctx.strokeStyle=`rgba(220,195,138,${al.toFixed(3)})`; tctx.lineWidth=(0.6+p.d*1.6); tctx.lineCap="round";
      tctx.beginPath(); tctx.moveTo(a.x,a.y); tctx.lineTo(p.x,p.y); tctx.stroke(); }
  }
}

/* ── starfield — subtle, real night sky (soft round points; a few delicate spikes) ── */
const cv = document.getElementById("starfield"); const ctx = cv.getContext("2d");
let stars = [], DPR = Math.min(devicePixelRatio||1, 1.75);
let parX = 0, parY = 0, parTX = 0, parTY = 0;
function initStars(){
  cv.width = innerWidth*DPR; cv.height = innerHeight*DPR;
  cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
  stars = [];
  // density scaled to area, but kept light (~1 star / 14k px²), capped
  const count = Math.min(80, Math.round(innerWidth*innerHeight/14000));
  let heroes = 0;
  for(let i=0;i<count;i++){
    const hero = heroes < 4 && Math.random() < 0.05;
    if(hero) heroes++;
    stars.push({ x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:((hero? 1.3+Math.random()*0.6 : 0.5+Math.random()*0.9))*DPR,
      base:(hero? .55+Math.random()*.2 : .25+Math.random()*0.35),
      amp:.10+Math.random()*0.14, period:4200+Math.random()*3200, phase:Math.random()*TAU,
      gold:Math.random()<0.35, hero,
      depth:(hero? .4+Math.random()*.4 : .12+Math.random()*0.4) });
  }
}
function drawStars(now){
  ctx.clearRect(0,0,cv.width,cv.height);
  parX += (parTX-parX)*0.06; parY += (parTY-parY)*0.06;
  for(const s of stars){
    const tw = reduce ? s.base : s.base + s.amp*Math.sin(now/s.period*TAU + s.phase); // opacity breathing only
    const a = Math.max(0, tw) * starOpacity;
    if(a<=0.004) continue;
    const x = s.x + parX*s.depth*DPR, y = s.y + parY*s.depth*DPR, r = s.r;
    const col = s.gold ? "224,201,148" : "214,228,220";
    // soft halo (small, cheap)
    const g = ctx.createRadialGradient(x,y,0,x,y,r*3.4);
    g.addColorStop(0,"rgba("+col+","+(a*0.55)+")");
    g.addColorStop(1,"rgba("+col+",0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*3.4,0,TAU); ctx.fill();
    // crisp round core
    ctx.fillStyle="rgba(255,253,247,"+Math.min(1,a)+")";
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    // delicate diffraction spike — heroes only, thin + short
    if(s.hero){
      const len=r*4.5;
      ctx.strokeStyle="rgba("+col+","+(a*0.4)+")"; ctx.lineWidth=Math.max(0.5,r*0.18);
      ctx.beginPath(); ctx.moveTo(x-len,y); ctx.lineTo(x+len,y); ctx.moveTo(x,y-len); ctx.lineTo(x,y+len); ctx.stroke();
    }
  }
}

function toggleAnchor(b){
  if(active === b){ collapse(); return; }

  active = b;
  b.el.classList.add("selected");
  // glide anchor toward brain
  gsap.to(b, { rTarget: innerR*0.46, duration:1.0, ease:"power3.inOut" });

  bodies.filter(x=>x.type==="anchor" && x!==b).forEach(s=>{ s.el.classList.remove("selected"); gsap.to(s,{op:0.55,duration:.5}); });
  // bloom children
  const now0 = performance.now();
  b.children.forEach((c,i)=>{
    c.el.style.display="flex"; c.el.classList.add("bloomed"); c.curR = innerR*0.5; c.s=0; c.op=0;
    place(c, now0); // position on the ring immediately (don't rely on rAF, which pauses when backgrounded)

/* ── THE PLANET DIVE (~500ms): clicked orb scales toward camera and fills
   the viewport; everything else recedes; destination loads + fades in. ── */
let flying=false, lastClick={x:innerWidth/2,y:innerHeight/2};
addEventListener("pointerdown", e=>{ lastClick={x:e.clientX,y:e.clientY}; }, true);
function flyToSection(href, label){
  if(flying) return; flying=true;
  if(reduce){ window.__hnNavigate(href); return; }
  var lm=window.__livingMind;
  var threads=document.getElementById("lm-threads");
  // sphere center on screen
  var sphRect=lm?lm.querySelector("#lmSphere").getBoundingClientRect():{left:innerWidth/2-86,top:innerHeight/2-86,width:172,height:172};
  var scx=sphRect.left+sphRect.width/2, scy=sphRect.top+sphRect.height/2, sr=sphRect.width/2;
  var tx=lastClick.x, ty=lastClick.y;
  var ang=Math.atan2(ty-scy,tx-scx);
  // a) TURN — mote snaps toward the incoming section
  if(lm){ lm.__locked=true; lm._lookXY(tx,ty); }
  // b) REACH — thread shoots from sphere edge to the section node
  var ex=scx+Math.cos(ang)*sr, ey=scy+Math.sin(ang)*sr;
  var thread=null;
  if(threads){
    thread=document.createElementNS("http://www.w3.org/2000/svg","path");
    var mxp=(ex+tx)/2-Math.sin(ang)*18, myp=(ey+ty)/2+Math.cos(ang)*18;
    var dpath="M"+ex+" "+ey+" Q "+mxp+" "+myp+" "+tx+" "+ty;
    thread.setAttribute("d",dpath); thread.setAttribute("stroke-width","2");
    var len=Math.hypot(tx-ex,ty-ey)*1.1; thread.style.strokeDasharray=len; thread.style.strokeDashoffset=len;
    threads.appendChild(thread);
    gsap.to(thread.style,{strokeDashoffset:0,duration:.26,ease:"power2.out"});
  }
  var ap=lm?lm.querySelector("#lmAperture"):null;
  gsap.timeline({onComplete:function(){ window.__hnNavigate(href); }})
    // c) CATCH — reel the node in (stage drifts toward center), aperture begins to open
    .to("#stage",{duration:.42,ease:"power2.in"},0)
    .to(thread?thread.style:{},{strokeDashoffset:-(len||0)*0.4,duration:.34,ease:"power2.in"},.22)
    // DILATE — gold-rimmed iris opens, light pours out, fills the screen
    .fromTo(ap||{},{width:0,height:0,opacity:1},{width:Math.max(innerWidth,innerHeight)*2.4,height:Math.max(innerWidth,innerHeight)*2.4,duration:.5,ease:"power3.in",
      boxShadow:"0 0 0 6px rgba(220,195,138,.9),0 0 120px rgba(220,195,138,.6)"},.32)
    .to("#stage",{opacity:0,duration:.3,ease:"power2.in"},.5)
    .to(["#topbar","#collapse-hint","#center-pick"],{opacity:0,duration:.25},.4);

/* ════ QUARTER REPLAY — 90-day time-lapse of the empire ════ */
(function(){
  var MONTHS=["شباط","آذار","نيسان","أيار"];
  function dayLabel(d){ // d in 0..89 → date label across the quarter (مارس→مايو 2026)
    var m=Math.floor(d/30), day=(d%30)+1;
    return toArabicDigits(String(day))+" "+(["آذار","نيسان","أيار"][Math.min(m,2)])+" ٢٠٢٦";
  }
  // central IQ history over 90 days (real-ish: dips mid-quarter, recovers to 92)
  function iqAt(d){ var t=d/89; var base=84+t*8; var dip=Math.sin(t*Math.PI*2.2)*2.4 - (t>0.4&&t<0.6?3:0); return Math.max(78,Math.min(93,base+dip)); }
  // per-anchor brightness curve (each group's "activity" evolves differently)
  var anchors=bodies.filter(function(b){return b.type==="anchor";});
  function anchorMul(b,d){ var t=d/89, i=anchors.indexOf(b);
    return 0.55 + 0.45*(0.5+0.5*Math.sin(t*Math.PI*(1.4+i*0.5)+i)); }
  // insight occurrences: each insight fires on a day, visible for a window
  var insightDays=insightEls.map(function(_,i){ return 12+i*13; });

  var qrActive=false, qrPlaying=false, qrRAF=null, qrStart=0;
  var bar=document.getElementById("qr-bar"), scrub=document.getElementById("qrScrub"), label=document.getElementById("qrLabel");
  if(!document.querySelector(".qr-banner")){ var bn=document.createElement("div"); bn.className="qr-banner"; bn.textContent="إعادة الربع · آخر ٩٠ يوماً"; document.body.appendChild(bn); }

  function applyDay(d){
    d=Math.max(0,Math.min(89,d));
    label.textContent = d>=89 ? "اليوم" : dayLabel(d);
    scrub.value=d; scrub.style.setProperty("--qrfill",(d/89*100)+"%");
    // sector/anchor brightness + gentle scale
    anchors.forEach(function(b){ b.qrMul=anchorMul(b,d); });
    // central IQ
    var iq=Math.round(iqAt(d)*10)/10;
    var tb=document.getElementById("tbIQ"); if(tb) tb.textContent="IQ "+toArabicDigits(String(Math.round(iq)));
    var cvIq=document.querySelector(".cv-iq"); if(cvIq) cvIq.innerHTML=Math.round(iq)+'<span class="iq-dec">٫'+toArabicDigits(String(Math.round((iq%1)*10)))+'</span>';
    // insight-stars flicker in/out as they "occurred"
    insightEls.forEach(function(e,i){ var od=insightDays[i]; var on = d>=od && d<=od+18; e.style.transition="opacity .5s"; e.style.opacity = on? (d===89?1:0.9) : 0.05; });
    document.body.classList.toggle("qr-past", d<89);
  }

  function startQR(){
    if(reduce){ // reduced-motion: static before/after — jump to start, then end
      enterMode(); applyDay(0); setTimeout(function(){ applyDay(89); },900); return;
    }
    enterMode(); qrPlaying=true; qrStart=performance.now();
    function step(now){ if(!qrPlaying) return; var p=Math.min((now-qrStart)/10000,1); applyDay(Math.round(p*89));
      if(p<1) qrRAF=requestAnimationFrame(step); else qrPlaying=false; }
    qrRAF=requestAnimationFrame(step);
  }
  function enterMode(){ qrActive=true; document.body.classList.add("qr-mode"); bar.classList.add("show"); }
  function exitQR(){
    qrActive=false; qrPlaying=false; if(qrRAF)cancelAnimationFrame(qrRAF);
    document.body.classList.remove("qr-mode","qr-past"); bar.classList.remove("show");
    anchors.forEach(function(b){ b.qrMul=undefined; });
    insightEls.forEach(function(e){ e.style.opacity=1; });
    var tb=document.getElementById("tbIQ"); if(tb) tb.textContent="IQ ٩٢";
    var cvIq=document.querySelector(".cv-iq"); if(cvIq) cvIq.innerHTML='92<span class="iq-dec">٫٤</span>';
  }
  document.getElementById("qreplay").addEventListener("click",function(){ if(qrActive) exitQR(); else startQR(); });
  scrub.addEventListener("input",function(){ qrPlaying=false; if(qrRAF)cancelAnimationFrame(qrRAF); if(!qrActive)enterMode(); applyDay(+scrub.value); });
  document.getElementById("qrNow").addEventListener("click",exitQR);
})();

/* Force the resting, fully-visible state — independent of the GSAP timeline.

   on a normal foreground load the animation has already finished and we just
   tidy up any leftover filings. */
function finalizeOrrery(){
  document.querySelectorAll("#filings").forEach(f=>f.remove());
  const anchors=bodies.filter(b=>b.type==="anchor");
  const stalled = anchors.every(b=>b.op<0.05) || +getComputedStyle(document.getElementById("brain")).opacity < 0.05;
  if(!stalled) return; // normal load already settled — leave the nice animation alone
  gsap.set(".aurora",{opacity:1}); gsap.set("#floor",{opacity:.85});
  gsap.set("#brain",{opacity:1}); gsap.set(".core",{scale:1,opacity:1});
  gsap.set(".ring",{opacity:1,scaleX:1,scaleY:1}); gsap.set(".brain-glow",{opacity:.7});
  starOpacity=1;
  anchors.forEach(b=>{ if(active!==b){ b.s=1; b.op=1; b.rTarget=innerR; } });
  insightEls.forEach(e=>{ gsap.killTweensOf(e); e.style.opacity=1; });
  document.getElementById("iq") && (document.getElementById("iq").innerHTML='92<span class="iq-dec">٫٤</span>');
  if(!gsap.getTweensOf(".ring.outer").length) ringSpin();
  started=true;
  const now=performance.now(); if(!t0) t0=now;
  for(const b of bodies){ if(b.op>0.001 || b.s>0.001) place(b, now); }
}

    if(!reduceM) gsap.to(el.querySelector(".isd"),{opacity:.55,duration:4,repeat:-1,yoyo:true,ease:"sine.inOut",delay:Math.random()*2}); // 8s breath
    // the mind acknowledges: a faint thread briefly connects sphere → star, then fades
    if(!reduceM) acknowledgeStar(pt.x,pt.y);
    el.addEventListener("mouseenter",function(){ showCard(rec); });
    el.addEventListener("mouseleave",function(){ hideCard(rec); });
    el.addEventListener("click",function(){ flyToSection(S(rec.ins.sec+".html"), SECTOR_AR[rec.ins.sec]||rec.ins.sec); });
    // auto-expire after a calm while
    rec.timer=setTimeout(function(){ removeStar(rec); }, 16000+Math.random()*8000);
  }
  function S(f){ return "sections/"+f; }
  function acknowledgeStar(tx,ty){
    var lm=window.__livingMind, threads=document.getElementById("lm-threads"); if(!lm||!threads) return;
    var r=lm.querySelector("#lmSphere").getBoundingClientRect(); var scx=r.left+r.width/2, scy=r.top+r.height/2, sr=r.width/2;
    var ang=Math.atan2(ty-scy,tx-scx);
    // thread stops short of the star, stays outside the orbit; just a brief acknowledging reach
    var ex=scx+Math.cos(ang)*sr, ey=scy+Math.sin(ang)*sr;
    var gx=scx+Math.cos(ang)*(sr+ (Math.hypot(tx-scx,ty-scy)-sr)*0.55), gy=scy+Math.sin(ang)*(sr+ (Math.hypot(tx-scx,ty-scy)-sr)*0.55);
    var p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d","M"+ex+" "+ey+" L "+gx+" "+gy); p.setAttribute("stroke-width","1.3"); p.setAttribute("opacity","0");
    var len=Math.hypot(gx-ex,gy-ey); p.style.strokeDasharray=len; p.style.strokeDashoffset=len; threads.appendChild(p);
    if(lm.__locked!==true && lm._lookXY) lm._lookXY(tx,ty); // glance toward the thought
    gsap.timeline({onComplete:function(){p.remove();}})
      .to(p,{attr:{opacity:.7},duration:.3})
      .to(p.style,{strokeDashoffset:0,duration:.4,ease:"power2.out"},"<")
      .to(p,{attr:{opacity:0},duration:.5,delay:.5,ease:"power1.in"});
  }
  function removeStar(rec){
    var i=liveStars.indexOf(rec); if(i<0)return; liveStars.splice(i,1);
    hideCard(rec);
    rec.el.style.transition="opacity 2s ease"; rec.el.classList.remove("lit");
    setTimeout(function(){ rec.el.remove(); }, 2100);
    clearTimeout(rec.timer);
  }
  function showCard(rec){
    if(rec.card) return;
    var c=document.createElement("div"); c.className="ins-card";
    c.innerHTML='<div class="ictop">'+(SECTOR_AR[rec.ins.sec]||"إشارة")+'</div><div class="ictext">'+rec.ins.t+'</div><a class="icmore">اعرض ←</a>';
    document.body.appendChild(c); rec.card=c;
    placeCard(rec);
    c.addEventListener("mouseenter",function(){ clearTimeout(rec._leave); });
    c.addEventListener("mouseleave",function(){ hideCard(rec); });
    c.addEventListener("click",function(){ flyToSection(S(rec.ins.sec+".html"), SECTOR_AR[rec.ins.sec]||rec.ins.sec); });
    requestAnimationFrame(function(){ c.classList.add("show"); });
  }
  function hideCard(rec){
    if(!rec.card) return; var c=rec.card; rec.card=null;
    c.classList.remove("show"); setTimeout(function(){ c.remove(); }, 320);
  }
  // clamp card: 24px from edges AND 24px outside the orbit safe zone; open inward/upward near corners
  function placeCard(rec){
    var c=rec.card; var M=24, gap=16;
    var cw=c.offsetWidth, ch=c.offsetHeight, vw=innerWidth, vh=innerHeight;
    var cx=vw/2, cy=56+(vh-56)/2, R=safeR();
    var sx=rec.x, sy=rec.y;
    // horizontal: open toward whichever side is the outer side (away from center)
    var openLeft = sx > cx; var left = openLeft ? sx-gap-cw : sx+gap, ox = openLeft?"100%":"0%";
    left=Math.max(M,Math.min(left,vw-cw-M));
    var top=Math.max(M+50,Math.min(sy-ch/2,vh-ch-M));
    // push the card out of the safe circle: if its nearest point is inside R, shove it outward
    function nearestDist(L,T){ var nx=Math.max(L,Math.min(cx,L+cw)), ny=Math.max(T,Math.min(cy,T+ch)); return Math.hypot(nx-cx,ny-cy); }
    if(nearestDist(left,top) < R+ (0)){
      // try opening the other horizontal way
      left = openLeft ? sx+gap : sx-gap-cw; left=Math.max(M,Math.min(left,vw-cw-M)); ox=openLeft?"0%":"100%";
      if(nearestDist(left,top) < R){
        // fall back to vertical: open up or down into the margin
        top = sy < cy ? Math.max(M+50, sy-gap-ch) : Math.min(vh-ch-M, sy+gap);
        left = Math.max(M,Math.min(sx-cw/2, vw-cw-M)); ox="50%";
      }
    }
    var oy=Math.max(0,Math.min(100,((sy-top)/ch)*100))+"%";
    c.style.left=left+"px"; c.style.top=top+"px"; c.style.setProperty("--ic-ox",ox); c.style.setProperty("--ic-oy",oy);
  }

  function startInsights(){
    // seed 3 stars, then keep a sparse population; auto-surface ONE card rarely
    addStar(); setTimeout(addStar,2000); setTimeout(addStar,4500);
    setInterval(function(){ if(!document.hidden && liveStars.length<5 && Math.random()<0.6) addStar(); }, 7000);
    if(!reduceM) setInterval(function(){
      if(document.hidden) return;
      var quiet=liveStars.filter(function(s){return !s.card;});
      if(quiet.length){ var pick=quiet[Math.floor(Math.random()*quiet.length)]; showCard(pick); setTimeout(function(){ hideCard(pick); }, 4500); }
    }, 12000);
  }

  // boot once the orrery has started
  mount(0);
  var boot=setInterval(function(){ if(started){ clearInterval(boot); startInsights(); } },400);
  setTimeout(function(){ if(!liveStars.length) startInsights(); }, 6500);
})();

function startThreshold(){
  const th = document.getElementById("threshold");
  const word = document.getElementById("thresh-word");
  const sub = document.getElementById("thresh-sub");
  let handed = false;
  function handoff(){
    if(handed) return; handed = true;
    th.classList.add("gone");
    setTimeout(()=>{ th.remove(); }, 750);
    maybeBriefing(runEntry); // morning briefing on first visit of the day, else straight in
  }
  if(reduce){
    gsap.set([word,sub],{opacity:1});
    setTimeout(handoff, 800);
    th.addEventListener("click", handoff);
    return;
  }
  document.getElementById("thresh-logo").classList.add("th-run");
  gsap.to(word,{opacity:1,duration:.5,delay:1.0});
  gsap.to(sub,{opacity:1,duration:.5,delay:1.2});
  setTimeout(handoff, 2100);   // logo draws (~1.4s) + holds, then dissolves into the Gathering
  th.addEventListener("click", handoff);
}
startThreshold();

/* ── THE MORNING BRIEFING — daily ritual, first visit of the day ── */
function maybeBriefing(then){
  var today=new Date().toISOString().slice(0,10);
  var seen; try{ seen=localStorage.getItem("hnerve_briefing"); }catch(e){}
  if(seen===today){ then(); return; }
  try{ localStorage.setItem("hnerve_briefing",today); }catch(e){}
  var rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ov=document.createElement("div"); ov.id="mb-overlay";
  ov.innerHTML=
    '<div class="mb-card">'+
      '<div class="mb-eyebrow">◆ موجز الصباح · ٣١ أيار ٢٠٢٦</div>'+
      '<h2 class="mb-greet">صباح الخير، أ. الحوراني</h2>'+
      '<p class="mb-narr">بينما كنتَ نائماً، واصلت <b>أرينا</b> صعودها — إشغالٌ بلغ <b>٧١٪</b> ورفع الإيراد إلى <b>٨٨٬٢١٠</b> دينار. نمت <b>المها</b> بنسبة <b>+٤٤٪</b>، لكنّ أربع دفعات ألبان (<b>١٤٬٥٠٨ لتر</b>) تقترب من الانتهاء وتستدعي قراراً اليوم. وحده إيراد <b>جامعة عمّان</b> تراجع <b>٦٤٪</b> — إشارةٌ حرجة تنتظر مراجعتك.</p>'+
      '<div class="mb-chips">'+
        '<span class="mb-chip up">▲ إيراد المجموعة +١٢٪</span>'+
        '<span class="mb-chip up">▲ إشغال أرينا +٤٪</span>'+
        '<span class="mb-chip down">▼ إيراد الأهلية −٦٤٪</span>'+
      '</div>'+
      '<div class="mb-actions">'+
        '<button class="mb-btn ghost" id="mbDigest">اعرض الموجز الكامل</button>'+
        '<button class="mb-btn primary" id="mbStart">ابدأ اليوم ←</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ ov.classList.add("show"); }); });
  function dismiss(go){ ov.classList.remove("show"); setTimeout(function(){ ov.remove(); if(go) go(); }, rm?0:600); }
  document.getElementById("mbStart").addEventListener("click",function(){ dismiss(then); });
  document.getElementById("mbDigest").addEventListener("click",function(){ window.__hnNavigate("sections/digest.html"); });
  ov.addEventListener("click",function(e){ if(e.target===ov) dismiss(then); });
}
</script>

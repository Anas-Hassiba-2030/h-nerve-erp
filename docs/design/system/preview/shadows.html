<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Elevation · layered shadows</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css"></head><body style="background:var(--surface)">
<div class="card-label">Shadows · always layered, never single</div>
<div class="row" style="gap:24px">
<div class="col" style="align-items:center;gap:9px"><div style="width:120px;height:62px;background:var(--surface-elevated);border-radius:14px;box-shadow:var(--shadow-soft)"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">--shadow-soft</span></div>
<div class="col" style="align-items:center;gap:9px"><div style="width:120px;height:62px;background:var(--surface-elevated);border-radius:14px;box-shadow:var(--shadow-glow)"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">--shadow-glow · hover</span></div>
<div class="col" style="align-items:center;gap:9px"><div style="width:120px;height:62px;background:var(--heri-cream);border:1px solid var(--heri-rule)"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">heritage · shadowless</span></div>
</div></body></html>

<head>

<title>H-Nerve · مساحة العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../living-bg.css"><link rel="stylesheet" href="_section.css"><link rel="stylesheet" href="../interactions.css"><link rel="stylesheet" href="../ambient.css"><link rel="stylesheet" href="../ops.css">
<style>
.ws-picker{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ws-picker label{font-size:11px;font-weight:700;color:var(--ink-muted)}
.ws-picker select{background:var(--cream);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--ui);font-size:15px;font-weight:700;padding:10px 16px;outline:none;cursor:pointer}
.ws-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:900px){.ws-grid{grid-template-columns:1fr}}
.ws-facet{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:18px}
.ws-facet h3{font-family:var(--display);font-size:18px;font-weight:600;color:var(--emerald);margin-bottom:3px;display:flex;align-items:center;gap:8px}
.ws-facet .fsub{font-size:11px;color:var(--ink-muted);margin-bottom:14px}
.ws-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ws-line:last-child{border-bottom:0}
.ws-line .v{font-family:var(--display);font-weight:600;color:var(--emerald);font-variant-numeric:tabular-nums}
.ws-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--emerald-soft),var(--emerald));border:0;border-radius:999px;padding:8px 14px;cursor:pointer;margin-top:12px;text-decoration:none}
.ws-btn.ghost{color:var(--emerald);background:transparent;border:1px solid var(--line)}
.ws-pri{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.ws-pri .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.ws-hub{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media(max-width:760px){.ws-hub{grid-template-columns:repeat(2,1fr)}}
.hub-tile{background:linear-gradient(160deg,#fffdf8,var(--cream));border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.hub-tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.hub-tile .hi{font-size:22px;margin-bottom:6px}
.hub-tile .ht{font-size:12.5px;font-weight:700;color:var(--ink)}
</style>
<link rel="stylesheet" href="../app-layer.css?v=nav3"><link rel="stylesheet" href="../states.css"></head>
<body><header id="topbar">
  <div class="tb-brand"><svg class="tb-mark" viewBox="0 0 100 100" fill="none"><defs><radialGradient id="ngws" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FBF3DC"/><stop offset="50%" stop-color="#DCC38A"/><stop offset="100%" stop-color="#C2A35A" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="42" stroke="#C2A35A" stroke-width="1.4" opacity=".6"/><ellipse cx="50" cy="50" rx="42" ry="17" stroke="#C2A35A" stroke-width="1.2" opacity=".45"/><g stroke="#DCC38A" stroke-width="6.5" stroke-linecap="round"><line x1="31" y1="26" x2="31" y2="74"/><line x1="69" y1="26" x2="69" y2="74"/><line x1="31" y1="50" x2="69" y2="50"/></g><circle cx="50" cy="50" r="15" fill="url(#ngws)"/><circle cx="50" cy="50" r="4.5" fill="#FBF3DC"/></svg>
    <span class="tb-word">H‑Nerve <span class="erp">ERP</span></span></div>
  <a class="tb-orbit" href="../orrery.html">↺ العودة إلى المدار</a>
  <button class="tb-user"><span class="tb-avatar">أ</span><span class="tb-uinfo"><span class="tb-uname">أ. الحوراني</span><span class="tb-urole">رئيس مجلس الإدارة</span></span></button>
</header>
<div class="wrap">
  <div class="sec-head reveal"><div>
    <div class="sec-eyebrow"><span class="tick"></span>مساحة عمل الشركة</div>
    <h1 class="sec-title" id="wsTitle" data-i18n="b4.title.workspace">مساحة العمل</h1>
    <p class="sec-sub">كونسول تشغيلي لكل شركة — الذكاء، المالية، العمليات، المشاريع، والفريق في مكان واحد.</p>
  </div><div class="sec-head-aside"><div class="ws-picker"><label>الشركة:</label><select id="wsSel"></select></div></div></div>
  <div class="ws-hub reveal" id="hub"></div>
  <div class="ws-grid">
    <div class="ws-facet reveal" id="fIntel"></div>
    <div class="ws-facet reveal" id="fFinance"></div>
    <div class="ws-facet reveal" id="fOps"></div>
    <div class="ws-facet reveal" id="fPipeline"></div>
    <div class="ws-facet reveal" id="fTeam"></div>
  </div>
</div>
<div class="br-toast" id="toast" style="background:linear-gradient(135deg,#fffdf8,#f6f1e7);color:var(--ink);border-color:var(--gold)"></div>

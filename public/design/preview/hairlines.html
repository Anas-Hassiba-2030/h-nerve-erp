<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hairline rules</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css"></head><body style="background:var(--surface)">
<div class="card-label">Hairlines do the work of borders (Heritage)</div>
<div style="background:var(--heri-cream);padding:14px 16px;border:1px solid var(--heri-rule-strong);position:relative">
<div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--heri-terracotta) 0%,var(--heri-ochre) 50%,var(--heri-teal) 100%)"></div>
<div class="eyebrow-heri" style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--heri-copper)">GROUP PULSE</div>
<div style="padding-bottom:10px;box-shadow:inset 0 -1px 0 var(--heri-rule);font-family:var(--font-display-latin);font-size:20px;color:var(--heri-ink);margin-top:4px">Section header</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:10px;border-top:1px solid var(--heri-rule-strong)">
<div style="padding:8px 10px;border-inline-end:1px solid var(--heri-rule)"><span class="num-display" style="font-size:17px;color:var(--heri-ink)">39.5M</span></div>
<div style="padding:8px 10px;border-inline-end:1px solid var(--heri-rule)"><span class="num-display" style="font-size:17px;color:var(--heri-ink)">71%</span></div>
<div style="padding:8px 10px"><span class="num-display" style="font-size:17px;color:var(--heri-ink)">75.0</span></div>
</div></div></body></html>

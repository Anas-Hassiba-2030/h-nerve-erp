<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Corner radii by register</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css"></head><body style="background:var(--surface)">
<div class="card-label">Radii · commit to one register per screen</div>
<div class="row" style="gap:18px;align-items:flex-end">
<div class="col" style="align-items:center;gap:7px"><div style="width:74px;height:48px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-soft)"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">16px · card</span></div>
<div class="col" style="align-items:center;gap:7px"><div style="width:74px;height:48px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:10px"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">10px · button</span></div>
<div class="col" style="align-items:center;gap:7px"><div style="width:74px;height:48px;background:var(--heri-cream-2);border:1px solid var(--heri-rule);border-radius:0"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">0px · heritage</span></div>
<div class="col" style="align-items:center;gap:7px"><div style="width:74px;height:48px;background:var(--m-bg-2);border:1px solid var(--m-rule);border-radius:14px"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">14px · mobile</span></div>
<div class="col" style="align-items:center;gap:7px"><div style="width:74px;height:28px;background:var(--brand-soft);border-radius:999px"></div><span class="mono" style="font-size:9.5px;color:var(--text-muted)">999px · pill</span></div>
</div></body></html>

[build]
builder = "nixpacks"
# Install deps, generate Prisma client, compile Next.js.
# DATABASE_URL is NOT needed at build time — prisma generate reads schema only.
buildCommand = "npm install && prisma generate && next build"

[deploy]
# Run pending migrations, seed demo data ONLY if the DB is empty
# (scripts/seed/seed-if-empty.ts is a no-op once seeded — never wipes real data),
# ALWAYS ensure the admin/owner accounts can sign in (scripts/seed/ensure-admins.ts),
# and top up the demo documents if the Document table is empty
# (scripts/seed/ensure-demo-docs.ts — fixes DBs seeded before the doc corpus existed).
# All wrapped so a hiccup can never block the deploy.
# Railway injects DATABASE_URL and other linked-service vars at this phase.
#
# The trailing top-ups fill sections a pre-existing prod DB never got
# (seed-if-empty no-ops once companies exist):
#   • ensure-sectors     → /hotels /dairy /farms /education + intelligence
#     (additive idempotent seedMissingSectors — find-or-creates parents, fills
#     ONLY empty sectors, never wipes). Runs EARLY so hotels exist before the
#     content top-ups that depend on them.
#   • ensure-brain-seed → /brain/* (count-guarded on an empty causal graph, so
#     it never clears accumulated brain signal; skips runBrainAnalysis = no AI spend)
#   • seed-markets       → /markets   (marketStock.upsert — idempotent)
#   • seed-v3-extras     → /projects + council (futureProject/councilDiscussion.upsert)
preDeployCommand = "prisma migrate deploy && (npx tsx scripts/seed/seed-if-empty.ts || true) && (npx tsx scripts/seed/ensure-admins.ts || true) && (npx tsx scripts/seed/ensure-sectors.ts || true) && (npx tsx scripts/seed/ensure-demo-docs.ts || true) && (npx tsx scripts/seed/ensure-supply-forecasts.ts || true) && (npx tsx scripts/seed/seed-erp-demo.ts || true) && (npx tsx scripts/seed/seed-demo-content.ts || true) && (npx tsx scripts/seed/ensure-brain-seed.ts || true) && (npx tsx scripts/seed/seed-markets.ts || true) && (npx tsx scripts/seed/seed-v3-extras.ts || true) && (npx tsx scripts/seed/ensure-org-hierarchy.ts || true)"
startCommand = "next start -p ${PORT:-3000}"

# Liveness probe — Railway restarts the container if this returns non-2xx.
# /api/health does SELECT 1 and returns 503 when DB is unreachable.
healthcheckPath = "/api/health"
healthcheckTimeout = 45

# Keep the service alive; do not let Railway sleep it on inactivity.
# Critical for the brain's scheduled jobs (weekly self-tuning, federation).
sleepApplication = false

# Restart on crash only; 3-retry cap prevents crash-loop billing runaway.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Explicit replica count. Remove this line to enable Railway autoscaling.
numReplicas = 1

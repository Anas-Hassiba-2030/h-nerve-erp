<!DOCTYPE html>
<html lang="ar" dir="rtl" data-living="work" data-ambient="finance">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H-Nerve · الأسواق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../living-bg.css">
<link rel="stylesheet" href="_section.css">
<link rel="stylesheet" href="../interactions.css">
<link rel="stylesheet" href="../ambient.css">
<link rel="stylesheet" href="../ops.css">
<style>
.mk-region{margin-bottom:18px}
.mk-region h2{font-family:var(--display);font-size:20px;font-weight:600;color:var(--emerald);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.mk-region h2 .rg{font-size:11px;font-weight:700;color:var(--ink-muted);background:var(--cream);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.stock{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .25s,border-color .25s}
.stock:hover{transform:translateY(-2px);border-color:var(--gold)}
.stock .sk-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stock .sym{font-size:13px;font-weight:800;color:var(--ink)}
.stock .ch{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.stock .ch.up{color:#3c7a5c}.stock .ch.down{color:#9a5648}
.stock .nm{font-size:11px;color:var(--ink-muted);margin:2px 0 8px}
.stock .px{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;color:var(--emerald)}
</style>
<link rel="stylesheet" href="../app-layer.css?v=nav3"><link rel="stylesheet" href="../states.css"></head>
<body><header id="topbar">
  <div class="tb-brand">
    <svg class="tb-mark" viewBox="0 0 100 100" fill="none"><defs><radialGradient id="ngmk" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FBF3DC"/><stop offset="50%" stop-color="#DCC38A"/><stop offset="100%" stop-color="#C2A35A" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="42" stroke="#C2A35A" stroke-width="1.4" opacity=".6"/><ellipse cx="50" cy="50" rx="42" ry="17" stroke="#C2A35A" stroke-width="1.2" opacity=".45"/><g stroke="#DCC38A" stroke-width="6.5" stroke-linecap="round"><line x1="31" y1="26" x2="31" y2="74"/><line x1="69" y1="26" x2="69" y2="74"/><line x1="31" y1="50" x2="69" y2="50"/></g><circle cx="50" cy="50" r="15" fill="url(#ngmk)"/><circle cx="50" cy="50" r="4.5" fill="#FBF3DC"/></svg>
    <span class="tb-word">H‑Nerve <span class="erp">ERP</span></span>
  </div>
  <a class="tb-orbit" href="/orrery">↺ العودة إلى المدار</a>
  <button class="tb-user"><span class="tb-avatar">أ</span><span class="tb-uinfo"><span class="tb-uname">أ. الحوراني</span><span class="tb-urole">رئيس مجلس الإدارة</span></span></button>
</header>
<div class="wrap">
  <div class="sec-head reveal">
    <div>
      <div class="sec-eyebrow"><span class="tick"></span data-i18n="b4.gc.eyebrowMarkets">النمو ورأس المال · الأسواق</div>
      <h1 class="sec-title" data-i18n="b4.title.markets">الأسواق</h1>
      <p class="sec-sub">تقييم المجموعة الداخلي والأسهم العامة المرتبطة — أبرز المحرّكات حسب المنطقة.</p>
    </div>
    <div class="sec-head-aside"><span class="sec-status"><span class="dot"></span>مباشر · سوق مفتوح</span></div>
  </div>

  <div class="kpi-grid reveal reveal-stagger">
    <div class="kpi-card ix-card"><div class="kpi-label">تقييم المجموعة</div><div class="kpi-val"><span>٣٩.٦M</span></div><div class="kpi-foot"><span class="kpi-hint">دينار</span><span class="delta up">▲ +١.٤٤٪</span></div></div>
    <div class="kpi-card ix-card"><div class="kpi-label">أعلى رابح</div><div class="kpi-val" style="font-size:24px"><span>أرينا</span></div><div class="kpi-foot"><span class="kpi-hint">+٤.٢٪ اليوم</span></div></div>
    <div class="kpi-card ix-card"><div class="kpi-label">مؤشّر السوق</div><div class="kpi-val"><span>١٬٨٤٢</span></div><div class="kpi-foot"><span class="kpi-hint">ASE عمّان</span><span class="delta up">▲ +٠.٨٪</span></div></div>
    <div class="kpi-card ix-card"><div class="kpi-label">الأسهم المرتبطة</div><div class="kpi-val"><span>٦</span></div><div class="kpi-foot"><span class="kpi-hint">عبر منطقتين</span></div></div>
  </div>

  <div id="regions"></div>
</div>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" data-living="night">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>H-Nerve · مستشار الدماغ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="living-bg.css"><link rel="stylesheet" href="app-layer.css">
<style>
:root{--night:#0D1F1A;--gold:#C2A35A;--gold-s:#DCC38A;--em:#1F4D3F;--ems:#2E6B57;--mist:#CDE0D6;--ui:"Cairo",sans-serif;--display:"Cormorant Garamond",serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--mist);font-family:var(--ui)}
body{display:flex;flex-direction:column}
::selection{background:rgba(194,163,90,.3)}
/* top bar */
#topbar{flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:rgba(13,31,26,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(194,163,90,.16);z-index:20}
.tb-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff}
.tb-brand .erp{color:var(--gold)}
.tb-back{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;background:rgba(194,163,90,.14);
  border:1px solid rgba(194,163,90,.35);color:var(--gold-s);font-weight:600;font-size:13px;text-decoration:none}
.tb-back:hover{background:rgba(194,163,90,.24);color:#fff}
/* layout */
#adv{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,44%) 1fr}
@media(max-width:820px){#adv{grid-template-columns:1fr;grid-template-rows:200px 1fr}}
/* orb side */
#orb-side{position:relative;display:grid;place-items:center;overflow:hidden;border-inline-end:1px solid rgba(194,163,90,.14)}
#orb-aura{position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(46,107,87,.45),transparent 65%);filter:blur(60px);animation:aura 16s ease-in-out infinite}
@keyframes aura{0%,100%{transform:translate(-3%,2%) scale(1)}50%{transform:translate(4%,-3%) scale(1.14)}}
.orb-wrap{position:relative;width:min(260px,60%);aspect-ratio:1}
#orbCanvas{width:100%;height:100%}
.orb-state{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-family:var(--display);font-style:italic;font-size:16px;color:var(--gold-s);opacity:.8;white-space:nowrap}
.orb-label{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--gold-s);opacity:.7;text-transform:uppercase}
/* chat side */
#chat-side{display:flex;flex-direction:column;min-height:0}
#thread{flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;font-size:14.5px;line-height:1.6}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--ems),var(--em));color:#fff;padding:12px 16px;border-radius:16px;border-bottom-left-radius:5px}
.msg.brain{align-self:flex-end;color:#e8e1d2;font-family:var(--display);font-size:17px;line-height:1.65;padding:4px 2px}
.msg.brain b{color:var(--gold-s);font-weight:600}
.msg.brain .ln{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.msg.brain .ln.in{opacity:1;transform:none}
.typing{align-self:flex-end;display:flex;gap:5px;padding:6px 2px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--gold-s);animation:tp 1.3s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
/* chips */
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 26px 12px}
.chip{font-size:12.5px;font-weight:600;color:var(--mist);background:rgba(194,163,90,.1);border:1px solid rgba(194,163,90,.3);
  border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .2s}
.chip:hover{background:rgba(194,163,90,.22);color:#fff}
/* composer */
#composer{display:flex;align-items:center;gap:9px;padding:14px 22px 18px;border-top:1px solid rgba(194,163,90,.14)}
#composer input{flex:1;background:rgba(13,31,26,.6);border:1px solid rgba(194,163,90,.25);border-radius:16px;color:#fff;
  font-family:var(--ui);font-size:14.5px;padding:13px 18px;outline:none}
#composer input::placeholder{color:var(--mist);opacity:.5}
.c-icon{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:17px;border:1px solid rgba(194,163,90,.3);background:rgba(194,163,90,.1);color:var(--gold-s)}
.c-icon.rec{background:rgba(168,106,92,.3);color:#cf9384;animation:tp 1.1s infinite}
.c-send{background:linear-gradient(135deg,var(--gold-s),var(--gold));color:#241b06;border:0}
@media (prefers-reduced-motion:reduce){#orb-aura,.typing span{animation:none}.msg.brain .ln{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<header id="topbar">
  <div class="tb-brand">H‑Nerve <span class="erp">ERP</span> · مستشار الدماغ</div>
  <a class="tb-back" href="orrery.html">↺ العودة إلى المدار</a>
</header>
<div id="adv">
  <div id="orb-side">
    <div id="orb-aura"></div>
    <div class="orb-wrap">
      <div class="orb-label">العقل المفكّر</div>
      <canvas id="orbCanvas"></canvas>
      <div class="orb-state" id="orbState">في انتظار سؤالك</div>
    </div>
  </div>
  <div id="chat-side">
    <div id="thread"></div>
    <div id="chips"></div>
    <div id="composer">
      <button class="c-icon" id="micBtn" title="إملاء صوتي">🎙</button>
      <input id="q" placeholder="اسأل الدماغ عن أي شركة أو قرار أو رقم…">
      <button class="c-icon c-send" id="sendBtn" title="إرسال">➤</button>
    </div>
  </div>
</div>
<script src="living-bg.js" defer></script>
<script src="advisor.js" defer></script>
</body>
</html>

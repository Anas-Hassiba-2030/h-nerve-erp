# Weekly Brain self-tuning (Phase 10).
#
# Railway has no built-in cron, so the scheduler lives here. This workflow
# fires GET /api/brain/cron with the bearer secret; the route iterates every
# ACTIVE tenant and refreshes its insights. See docs/RUNBOOK.md § 5.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      production base URL, no trailing slash
#                (e.g. https://h-nerve-erp.up.railway.app)
#   CRON_SECRET  must equal the CRON_SECRET set on the Railway service
name: Brain weekly self-tuning

on:
  schedule:
    # Mondays 06:00 UTC. Edit this expression to change cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Never run two refreshes at once.
concurrency:
  group: brain-cron
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire /api/brain/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set."
            exit 1
          fi
          code=$(curl -sS --max-time 300 -o /tmp/cron.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/brain/cron")
          echo "HTTP $code"
          cat /tmp/cron.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Brain cron returned HTTP $code (expected 200)."
            exit 1
          fi

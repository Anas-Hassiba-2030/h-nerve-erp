[build]
builder = "nixpacks"
# Install deps, generate Prisma client, compile Next.js.
# DATABASE_URL is NOT needed at build time — prisma generate reads schema only.
buildCommand = "npm install && prisma generate && next build"

[deploy]
# Run pending migrations, seed demo data ONLY if the DB is empty
# (scripts/seed/seed-if-empty.ts is a no-op once seeded — never wipes real data),
# ALWAYS ensure the admin/owner accounts can sign in (scripts/seed/ensure-admins.ts),
# and top up the demo documents if the Document table is empty
# (scripts/seed/ensure-demo-docs.ts — fixes DBs seeded before the doc corpus existed).
# All wrapped so a hiccup can never block the deploy.
# Railway injects DATABASE_URL and other linked-service vars at this phase.
preDeployCommand = "prisma migrate deploy && (npx tsx scripts/seed/seed-if-empty.ts || true) && (npx tsx scripts/seed/ensure-admins.ts || true) && (npx tsx scripts/seed/ensure-demo-docs.ts || true) && (npx tsx scripts/seed/ensure-supply-forecasts.ts || true) && (npx tsx scripts/seed/seed-erp-demo.ts || true) && (npx tsx scripts/seed/seed-demo-content.ts || true)"
startCommand = "next start -p ${PORT:-3000}"

# Liveness probe — Railway restarts the container if this returns non-2xx.
# /api/health does SELECT 1 and returns 503 when DB is unreachable.
healthcheckPath = "/api/health"
healthcheckTimeout = 45

# Keep the service alive; do not let Railway sleep it on inactivity.
# Critical for the brain's scheduled jobs (weekly self-tuning, federation).
sleepApplication = false

# Restart on crash only; 3-retry cap prevents crash-loop billing runaway.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Explicit replica count. Remove this line to enable Railway autoscaling.
numReplicas = 1
